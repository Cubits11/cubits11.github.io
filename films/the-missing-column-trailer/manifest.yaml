falsifier: >-
  A clean-clone execution of the bound kernel on marginals (0.10, 0.10) returns AND bounds other than
  [0.0, 0.10] (CC-001/CC-004, REJECT); scripts/verify_census.py --counts prints counts other than 20 /
  14 / 0 / 5 with 2 via release (MC-001, REJECT); scripts/reanalyze_bells_subset.py recomputes an all-miss
  other than 9/82 or scripts/identification.py a set other than {0 … 12} (MC-002/MC-003, REJECT); or any
  rendered frame shows a readout other than 10/100 for either guard while the BOTH counter moves — in
  each case bind_facts.py --check fails before this film can be re-rendered.
non_claims:
- does not certify any stacked system as safe and shows no measured deployed stack
- >-
  does not estimate or recover the true dependence between any two guards; the amber points are what one
  assumption would select
- >-
  does not claim any evaluated guardrail performs poorly; an unfilled column is a reporting fact
- >-
  does not treat the BELLS 9/82 as a rate or a population estimate; it is counting arithmetic on one author-selected
  released file
- the census is a bounded single-reviewer search, not proof of universal absence
