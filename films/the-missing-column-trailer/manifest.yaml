id: the-missing-column-trailer
title: The Missing Column — trailer
cohort: A-derivative
grammar: >-
  four acts from the record, cut for a feed: paper-and-ink construction, the licensed interval, the census
  tallies, one released file
duration_s: 34
thesis: >-
  Two identical scores license a whole interval of joint outcomes; one assumption picks a point inside
  it; of 20 public evaluations none documents matched thresholds with full exposure and 5 carry any joint-evidence
  artifact; on the one released file the marginals leave 13 possible counts and the rows say 9.
epistemic_operation: >-
  fixed marginals with moving overlap → a set of feasible worlds (I–II); classification against frozen
  criteria → mechanical counts (III); marginals → sharp finite identified set → a union identifies the
  count (IV)
claim: >-
  For marginals (0.10, 0.10) the both-fail probability is identified only to [0.0, 0.10] and independence
  names 0.01 (CC-001, CC-004). As of 2026-08-27, of 20 examined evaluations 14 establish a shared basis,
  0 document matched thresholds with full exposure, and 5 provide a joint-evidence artifact, 2 of them
  only via a per-item release (MC-001). On the BELLS 2025 released subset the five marginals identify
  the all-miss count only to {0 … 12} of 82; the released rows give 9; the independence plug-in expects
  2.87 (MC-002, MC-003).
scope: >-
  A montage of four bound facts with no new arithmetic: the construction and interval are the Same Scores
  master's (illustrative population, CC-001 input, CC-004 witnesses); the census counts are verify_census.compute_counts
  on census.yaml at the freeze, one primary reviewer, bounded search; the BELLS numbers are counting arithmetic
  on one author-selected file at native, unstated operating points. Nothing on screen is a measured deployed
  stack.
status: >-
  supported_within_scope — bound to CC-001, CC-004, MC-001, MC-002, MC-003 at their registered commits
