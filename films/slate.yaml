    status: cohort_a
    thesis: "Two distributions over three guards can share every single and every pairwise failure rate and still differ in how often all three fail together."
    epistemic_operation: "order-two joint evidence fails to identify an order-three event; a constructive counterexample"
    visual_mechanism: "eight outcomes as cube corners; mass on even corners versus odd corners; the cube's three shadows (pairwise walls) are identical; the 111 corner differs"
    why_motion: "rotation shows the shadows stay identical from every angle while the cubes are visibly different objects"
    opening_image: "one wireframe cube with four corners lighting up"
    turn: "the second cube; the \"=\" between shadow rows; both cubes turn to face the all-three-fail corner: 0 versus 0.25"
    final_image: "two cubes, identical shadow walls, one corner empty, one full, the sentence \"Every pair measured. The stack still unknown.\""
    evidence_dependency: [CC-003.singleton, CC-003.pairwise, CC-003.triple_even, CC-003.triple_odd, CC-003.even_atoms, CC-003.odd_atoms]
    misunderstanding_risk: "a viewer reads the construction as a frequency claim — the ledger tag says CONSTRUCTED · SYNTHETIC · possibility proof · decision Narrow"
