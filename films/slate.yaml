    epistemic_operation: "direction matters — what marginals can and cannot certify; improvement floor 0 versus burden floor max f_i"
    visual_mechanism: "an industrial turnstile; 50 benign prompts pass five gates; the floor line at 20% (the largest single flag rate) drawn before any gate opens; the realized 38% lands above it"
