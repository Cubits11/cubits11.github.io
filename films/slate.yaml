# The film slate — cubits11 cinematic research laboratory, Experiment 2.
#
# Source of truth for films/SLATE.md (GENERATED by scripts/films/slate.py;
# --check fails on drift). Every live concept is scored 0–10 on eight axes;
# the gate is: conceptual_clarity, epistemic_integrity and distinctiveness
# must each be ≥ 8 or the concept is killed and replaced. Killed concepts are
# kept below with their scores and the reason — a slate that hides its
# rejects is a slate that cannot learn.
#
# Scores for Cohort A are the PRE-RENDER predictions; films/LEDGER.md records
# what the pixels then showed. Evidence keys name facts in films/data/facts.json.

version: 1
dated: "2026-09-01"
axes: [conceptual_clarity, novelty, epistemic_integrity, visual_memorability, silent_comprehension, poster_strength, render_feasibility, distinctiveness]
gate: {conceptual_clarity: 8, epistemic_integrity: 8, distinctiveness: 8}

concepts:
  - id: same-scores-different-worlds
    title: "Same Scores, Different Worlds"
    status: cohort_a
    thesis: "Two guards that each miss 10 of 100 can miss the same item anywhere from 0 to 10 times; the scores never move while the joint count runs the whole interval."
    epistemic_operation: "fixed marginals with moving overlap → a set of feasible worlds; endpoint witnesses; an assumption selecting one point"
    visual_mechanism: "a paper population sheet; ink discs (guard A misses) and ink rings (guard B misses); rings hop from disjoint cells onto disc cells while both counters stay pinned at 10/100"
    why_motion: "the hop IS the argument — the same score, a different item; a static figure can only show two worlds, motion shows that every world in between is reachable without touching a score"
    opening_image: "an empty paper sheet; ten ink discs stamp in; the counter reads 10 / 100 · pinned"
    turn: "hard cut to two sheets side by side with identical score lines and both-miss 0 versus 10; the licensed interval appears with independence as one amber point"
    final_image: "the two worlds over the cyan interval 0–10% and the amber 1% tick, locator beneath"
    evidence_dependency: [CC-001.marginals, CC-001.and_bounds, CC-001.independence_and, CC-004.witness_lower, CC-004.witness_upper]
    misunderstanding_risk: "a viewer reads the sweep as estimating the true overlap — the readout names each position a feasible world and the endpoints witnesses, never an estimate"
    implementation: "Canvas 2D, films/lib runtime, seeded cell shuffle"
    complexity: M
    grammar: "paper and ink"
    scores: {conceptual_clarity: 10, novelty: 8, epistemic_integrity: 10, visual_memorability: 8, silent_comprehension: 9, poster_strength: 9, render_feasibility: 10, distinctiveness: 9}

