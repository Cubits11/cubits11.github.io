id: thirteen-worlds
title: Thirteen Worlds, One File
cohort: A
grammar: mechanical counting instrument — five rods, eighty-two positions, beads
duration_s: 36
thesis: >
  The five published miss rates of the BELLS supervisors pin the all-miss
  count only to {0 … 12} of 82 — thirteen worlds; a same-denominator union
  fixes it at 9, and independence's 2.87 prompts was never one of the worlds.
epistemic_operation: >
  marginals → finite identified set (sharp bounds, endpoint attained) →
  a union aggregate identifies the count → positions remain unidentified.
claim: >
  On the 82 prompts labelled harmful in the released BELLS subset, the five
  per-guard miss counts (12, 30, 57, 77, 82) identify the static all-miss
  count only up to {0/82 … 12/82}; the released OR-union flags 73, so the
  all-miss count is 9 (11.0%); the independence plug-in is 3.49%, or 2.87
  prompts, and the recomputed rate is 3.14× that plug-in on this file.
scope: >
  Exactly the released file at the bound commit, counting arithmetic at the
  vendors' released binary verdicts. The bead COUNTS per rod, the union, and
  the all-miss count are registered values re-asserted against the
  hash-verified file in CI (MC-002). The bead POSITIONS are a construction:
  every arrangement shown satisfies the five counts, and the final one also
  satisfies the union; the released rows are never redistributed. No
  population estimate, no vendor ranking, no claim about adversarial prompts.
status: supported_within_scope — bound to MC-002 (counts) and MC-003 (identification); positions constructed
