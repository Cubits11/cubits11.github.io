objects:
  - object: the five rods, their labels and bead counts (misses per released column)
    status: OBSERVED
    note: 82 − registered catches; re-asserted against the hash-verified file by scripts/reanalyze_bells_subset.py
  - object: where each rod's beads sit, including the sliding rod
    status: CONSTRUCTED
    note: one contiguous-block arrangement per moment; every position shown satisfies the five counts
  - object: the amber all-miss columns and the running count
    status: DERIVED
    note: the intersection of the drawn blocks; the count walks exactly the finite identified set
  - object: the axis {0 … 12} and the continuous set [0%, 14.63%]
    status: PROVED
    note: MC-003, checked by scripts/identification.py
  - object: the amber dashed marker at 2.87 prompts
    status: DERIVED
    note: independence plug-in — a model's point, not a count
  - object: the union bar (73/82) and the pinned count 9/82
    status: OBSERVED
    note: MC-002 registered union and all-miss
evidence_commits:
  - claim: MC-002
    repo: CentreSecuriteIA/bells_leaderboard
    commit: 507566c5a4606c8e3dec0bd59a5c5fde62594951
falsifier: >
  Recomputing from the bound, hash-verified file yields any per-guard catch
  count, union, or all-miss different from the expected block (MC-002,
  REJECT); or a joint law with the five stated miss rates attains an all-miss
  rate outside [0, 12/82] (MC-003, REJECT); or the film's sliding rod ever
  produces an all-miss count outside {0 … 12} — checkable by re-rendering
  and reading the counter at every frame.
non_claims:
  - not an observed deployed five-guard stack; the OR of released columns is a static aggregation
  - not a population estimate and not a confidence interval; the subset was author-selected under an unstated rule
  - not a ranking or endorsement of any vendor; verdicts are at unstated default configurations
  - the bead positions are not the released rows; pairwise overlaps are not identified by the aggregates shown and are not claimed
  - the 3.14× ratio describes this subset's arithmetic, not a law of guardrail dependence
claim_frames:
  - t: 16.5
    shows: the sliding rod nested — all-miss reads 12/82 (the upper endpoint, min p) with the finite identified set {0…12} drawn on the axis
  - t: 27.0
    shows: the union bar 73/82 pins the all-miss count at 9/82; the independence marker at 2.87 prompts sits between integers
