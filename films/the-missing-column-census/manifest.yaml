id: the-missing-column-census
title: The Missing Column, Counted
cohort: A
grammar: brutalist information design — one table, twenty rows, the column that is usually empty
duration_s: 40
thesis: >
  Of 20 public guardrail evaluations meeting frozen criteria, 14 report no
  joint-evidence artifact and 0 document matched operating thresholds with
  full exposure; the count is a fact about reporting inside a bounded
  search, corrected once in public and declared with its sensitivity.
epistemic_operation: >
  classification against frozen criteria → mechanical counts; a ladder of
  strata rather than one verdict; a falsifier that fired and was recorded;
  bounded search ≠ universal absence.
claim: >
  As of 2026-08-27, among 20 examined public evaluations, 14 establish a
  shared item set and common event definition, 12 state no threshold
  mismatch, 0 document matched thresholds with full exposure; 5 provide a
  declared joint-evidence artifact (4 print a composition result, 2 release
  computable per-item outcomes, 1 does both), 14 report none, 1 is not
  comparable. The 19/13/4 envelope was rejected on 2026-08-30 by the claim's
  own falsifier and retained in the revision history; a declared sensitivity
  (archive-evidenced pre-freeze visibility) computes 19/13/4.
scope: >
  A census of reporting bounded by its documented search protocol, classified
  by a single primary reviewer with no second review yet. It says nothing
  about how any evaluated system or stack performs. Every count on screen is
  verify_census.compute_counts on census.yaml; the per-row ladder flags use
  the identical predicates and are asserted to reproduce 14/12/0.
status: supported_within_scope — bound to MC-001; counts derived from census.yaml at bind time
