objects:
  - object: the twenty row ids and their classification cells
    status: REGISTRY
    note: one reviewer's first-pass classification of each public source against frozen criteria v1
  - object: the per-system dashes in the second column
    status: ILLUSTRATIVE
    note: presence marks only — no score from any source is shown
  - object: the tallies 14 / 5 / 1, the K split 4 / 2 / 1, and the ladder 14 / 12 / 0
    status: DERIVED
    note: verify_census.compute_counts and scripts/facts.registry
  - object: the correction stamp 19/13/4 → 20/14/5 dated 2026-08-30
    status: REGISTRY
    note: census.yaml revision_history; the rejected envelope is retained there
  - object: the sensitivity envelope 19/13/4
    status: REGISTRY
    note: a declared alternative reading, shown only beside the word sensitivity and never bare
  - object: the edge-of-search panel — 20 / 9 / 15
    status: DERIVED
    note: examined, exclusions, unexamined candidates in census.yaml
evidence_commits:
  - claim: MC-001
    repo: Cubits11/cubits11.github.io
    commit: 6a6f587a2c0a5dbd1e8fea065c383938877fe3b0
falsifier: >
  A qualifying public evaluation meeting criteria v1 and published on or
  before 2026-08-27 is shown absent from the census, or a row misreports its
  source such that recomputed N, M, or K differ from 20/14/5 (MC-001, REJECT);
  or scripts/verify_census.py --counts prints counts other than the ones on
  screen — in which case bind_facts.py --check fails before this film can be
  re-rendered.
non_claims:
  - does not claim any evaluated guardrail or stack performs poorly; an unfilled column is a reporting fact, not a performance finding
  - does not claim the unmeasured joint statistics would reveal dependence
  - does not audit the quality of any per-system evaluation; the per-system dashes carry no scores
  - does not claim exhaustive coverage beyond the examined set; the 15 unexamined candidates are unknown, not absent
  - the sensitivity envelope is never a bare replacement for 20/14/5
claim_frames:
  - t: 11.5
    shows: the joint-evidence column complete — 14 not reported, 5 present, 1 not comparable, of 20
  - t: 23.5
    shows: the ladder tallied 14 / 12 / 0 with the sentence "0 of 20 document matched operating thresholds with full exposure"
  - t: 34.0
    shows: the edge-of-search panel — 20 examined, 9 excluded, 15 unexamined
render:
  fps: 30
  formats: [master, vertical]
  poster_t: 23.5
