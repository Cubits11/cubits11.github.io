<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Same Scores — social square</title>
<link rel="stylesheet" href="../lib/tokens.css">
<!--
  Same Scores, Different Worlds — feed-native derivative (1080×1080, 11 s).
  One proof compressed to one perceptual event: two readouts that never move,
  one arrangement that does, one counter that runs 0 → 10, then the name of
  what happened, the point independence would pick, and one action.
  No logo, no title card, no project vocabulary before the phenomenon.
  Every number is read from films/data/facts.json (CC-001, CC-004); the cell
  arrangement is the master film's (same seed).
-->
<div id="stage"></div>
<script src="../lib/film.js"></script>
<script>
'use strict';
const { H, TOK } = Film;
const { k, sm, eio, eo3, eo5, lerp, text, line, disc, ring, measure, shuffled, hexA } = H;

const DUR = 11.0;
const N = 100, SIDE = 10;
let P1, P2, LO, HI, IND, A_CELLS, B_HOME;
const T_HOP0 = 0.7, HOP = 0.5, HOP_DUR = 0.34;      // ten hops, 0.7 → 5.7 s
const T_NAME = 6.5, T_AXIS = 8.2, T_CTA = 9.9;

function setup({ fact }) {
  [P1, P2] = fact('CC-001.marginals');
  [LO, HI] = fact('CC-001.and_bounds');
  IND = fact('CC-001.independence_and');
  fact('CC-004.witness_lower'); fact('CC-004.witness_upper');   // the two end states drawn below are these witnesses
  const cells = shuffled([...Array(N).keys()], 0xC0FFEE);        // identical arrangement to the master
  A_CELLS = cells.slice(0, Math.round(P1 * N));
  B_HOME = cells.slice(Math.round(P1 * N), Math.round(P1 * N) + Math.round(P2 * N));
}
const cellXY = (i, x0, y0, c) => [x0 + (i % SIDE) * c + c / 2, y0 + Math.floor(i / SIDE) * c + c / 2];
const hopU = (t, i) => eio(k(t, T_HOP0 + i * HOP, T_HOP0 + i * HOP + HOP_DUR));
const landed = t => B_HOME.reduce((n, _, i) => n + (hopU(t, i) >= 1 ? 1 : 0), 0);

// All labels are >=54 source pixels: >=14 CSSpx at a 280px player / 320px viewport.
function render(t, g, L) {
  const W = L.W;
  const label = (s, x, y, o = {}) => text(g, s, x, y, { font: 'sans', size: 54, color: TOK.ink, maxW: W - 160, ...o });
  label('Illustration — no measured system', 80, 65, { color: TOK.review });
  label('A misses', 80, 145); label('B misses', 600, 145);
  text(g, `${Math.round(P1 * N)}/${N}`, 80, 257, { font: 'serif', size: 104, weight: 500 });
  text(g, `${Math.round(P2 * N)}/${N}`, 600, 257, { font: 'serif', size: 104, weight: 500 });
  label('Fixed scores; all 100 items', 80, 320, { color: TOK.evidence });
  const c = 38, gw = SIDE * c, gx = (W - gw) / 2, gy = 370, pad = 16;
  g.save(); g.globalAlpha = 1 - 0.85 * sm(t, T_AXIS, T_AXIS + 0.3);
  g.fillStyle = TOK.paper; g.fillRect(gx - pad, gy - pad, gw + pad * 2, gw + pad * 2);
  for (let i = 0; i <= SIDE; i++) {
    line(g, gx + i * c, gy, gx + i * c, gy + gw, TOK.paperLine, 1);
    line(g, gx, gy + i * c, gx + gw, gy + i * c, TOK.paperLine, 1);
  }
  A_CELLS.forEach(cell => { const [x, y] = cellXY(cell, gx, gy, c); disc(g, x, y, c * 0.24, TOK.paperInk); });
  B_HOME.forEach((home, i) => {
    const u = hopU(t, i), [hx, hy] = cellXY(home, gx, gy, c), [ax, ay] = cellXY(A_CELLS[i], gx, gy, c);
    ring(g, lerp(hx, ax, u), lerp(hy, ay, u) - Math.sin(u * Math.PI) * c * 0.5, c * 0.34, TOK.paperInk, 3.5);
  });
  g.restore();
  label('Fill: A miss · Ring: B miss', W / 2, 815, { align: 'center', color: TOK.muted });
  label('Both miss', 80, 890);
  text(g, `${landed(t)}/${N}`, 80, 1010, { font: 'serif', size: 112, weight: 500 });
  if (t >= T_NAME) {
    label('Same scores.', W - 80, 905, { align: 'right', size: 54 });
    label('Different worlds.', W - 80, 985, { align: 'right', size: 54, color: TOK.gold });
  }
  if (t >= T_AXIS) {
    g.fillStyle = TOK.bg; g.fillRect(80, 350, W - 160, 430);
    label('Possible shared misses', W / 2, 420, { align: 'center', color: TOK.evidence });
    line(g, 210, 530, 870, 530, TOK.evidence, 8);
    label(H.pct(LO), 210, 495, { align: 'center' });
    label(H.pct(HI), 870, 495, { align: 'center' });
    disc(g, lerp(210, 870, IND / HI), 530, 15, TOK.review);
    label(`Independence picks ${H.pct(IND)}.`, W / 2, 630, { align: 'center', color: TOK.review });
    label('One assumption; one point.', W / 2, 710, { align: 'center', color: TOK.review });
  }
  if (t >= T_CTA) {
    g.fillStyle = TOK.bg; g.fillRect(80, 350, W - 160, 430);
    label("Don't trust the film.", W / 2, 470, { align: 'center', size: 62 });
    label('Try the 60-second proof', W / 2, 575, { align: 'center', size: 62 });
    label('cubits11.github.io/try', W / 2, 690, { align: 'center', color: TOK.gold, size: 54 });
  }
}

Film.define({
  id: 'same-scores__social-square', title: 'Same Scores — social square',
  duration: DUR, fps: 30, poster_t: 10.8,
  claimFrames: [
    { t: 0.3, label: 'opening: A 10/100, B 10/100, both 0/100 — nothing has moved yet' },
    { t: 3.2, label: 'mid-transition: half the rings have landed; the readouts have not changed' },
    { t: 6.2, label: 'opposite endpoint: both 10/100 with the two readouts unchanged' },
    { t: 7.4, label: 'the name: SAME SCORES. DIFFERENT WORLDS.' },
    { t: 9.6, label: 'the interval 0–10% with the amber point at 1% labelled as what independence picks' },
    { t: 10.8, label: "the action: DON'T TRUST THE FILM. RUN THE 60-SECOND PROOF. cubits11.github.io/try" }
  ],
  setup, render
});
</script>
