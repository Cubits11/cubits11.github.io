<!doctype html>
<meta charset="utf-8">
<title>What the Seal Proves</title>
<link rel="stylesheet" href="../lib/tokens.css">
<!--
  What the Seal Proves — Cohort A, film 6.
  Grammar: paper documents and a three-station press. Two receipts that
  differ in bytes pass through PARSE → CANONICALIZE → DIGEST and come out
  under one seal: the pipeline's kernel. Then the seal is verified, and its
  light stops at a boundary: SAFE? AUTHORIZED? CORRECT? stay dark. The
  digests are real SHA-256 over the bytes shown, computed at bind time by the
  film's own toy canonicalizer. The boundary sentence is GA-001's registered
  non-claim, quoted verbatim.
-->
<div id="stage"></div>
<script src="../lib/film.js"></script>
<script>
'use strict';
const { H, TOK } = Film;
const { k, sm, win, eio, eo3, eo5, lerp, text, line, disc, ring, kicker, stamp, locator, ledgerTag, roundRect, dashRect, hexA, measure, paragraph } = H;

const DUR = 34;
let RAW_A, RAW_B, CANON, D_A, D_B, D_C, NONCLAIMS, COMMIT;
const T_CUT = 19.0;
const STATIONS = ['PARSE', 'CANONICALIZE', 'DIGEST'];

function setup({ fact }) {
  RAW_A = fact('RECEIPT.raw_a'); RAW_B = fact('RECEIPT.raw_b'); CANON = fact('RECEIPT.canonical');
  D_A = fact('RECEIPT.digest_raw_a'); D_B = fact('RECEIPT.digest_raw_b'); D_C = fact('RECEIPT.digest_canonical');
  NONCLAIMS = fact('GA-001.non_claims'); COMMIT = fact('GA-001.support_commit');
}
const short = d => d.slice(0, 12) + '…' + d.slice(-6);

function card(g, x, y, w, h, body, digest, alpha, L, o) {
  if (alpha <= 0.001) return;
  const u = L.u;
  g.save(); g.globalAlpha *= alpha;
  g.fillStyle = TOK.paper; roundRect(g, x, y, w, h, 4 * u); g.fill();
  text(g, o.title, x + 18 * u, y + 30 * u, { font: 'mono', size: 13 * u, color: TOK.paperMuted, track: 0.1, maxW: w - 30 * u });
  text(g, body, x + 18 * u, y + 66 * u, { font: 'mono', size: o.bodySize || 17 * u, color: TOK.paperInk, maxW: w - 30 * u });
  if (digest) {
    line(g, x + 18 * u, y + h - 44 * u, x + w - 18 * u, y + h - 44 * u, TOK.paperLine, 1);
    text(g, 'sha256', x + 18 * u, y + h - 20 * u, { font: 'mono', size: 12 * u, color: TOK.paperMuted, track: 0.1 });
    text(g, short(digest), x + 82 * u, y + h - 20 * u, { font: 'mono', size: 13 * u, color: o.digestColor || TOK.paperInk, maxW: w - 100 * u });
  }
  g.restore();
}

function roller(g, x, y, w, label, alpha, L, active) {
  if (alpha <= 0.001) return;
  const u = L.u;
  g.save(); g.globalAlpha *= alpha;
  g.fillStyle = TOK.surface; g.fillRect(x, y - 26 * u, w, 52 * u);
  g.strokeStyle = active ? TOK.evidence : TOK.lineStrong; g.lineWidth = 2 * u; g.strokeRect(x, y - 26 * u, w, 52 * u);
  for (let i = 1; i < 6; i++) line(g, x + i * (w / 6), y - 26 * u, x + i * (w / 6), y + 26 * u, TOK.line, 1);
  text(g, label, x + w / 2, y - 40 * u, { font: 'mono', size: 14 * u, color: active ? TOK.evidence : TOK.muted, align: 'center', track: 0.14 });
  g.restore();
}

/* a vertical press gate the cards pass through (master layout) */
function gate(g, x, y, label, alpha, L, active) {
  if (alpha <= 0.001) return;
  const u = L.u, w = 44 * u, h = 560 * u;
  g.save(); g.globalAlpha *= alpha;
  g.fillStyle = TOK.surface; g.fillRect(x - w / 2, y - h / 2, w, h);
  g.strokeStyle = active ? TOK.evidence : TOK.lineStrong; g.lineWidth = 2 * u; g.strokeRect(x - w / 2, y - h / 2, w, h);
  for (let i = 1; i < 12; i++) line(g, x - w / 2, y - h / 2 + i * (h / 12), x + w / 2, y - h / 2 + i * (h / 12), TOK.line, 1);
  text(g, label, x, y - h / 2 - 16 * u, { font: 'mono', size: 14 * u, color: active ? TOK.evidence : TOK.muted, align: 'center', track: 0.14 });
  g.restore();
}

function render(t, g, L, { fact }) {
  const u = L.u;
  if (t < T_CUT) {
    kicker(g, 'TWO RECEIPTS · ONE PIPELINE · ONE SEAL', L.m + 20 * u, L.vertical ? 150 * u : 120 * u, { size: 18 * u, maxW: L.W - 2 * L.m });
    const cw = L.vertical ? 420 * u : 400 * u, ch = 190 * u;
    // stage positions: documents travel through three stations
    const sx = [L.vertical ? L.cx : 700 * u, L.vertical ? L.cx : 1060 * u, L.vertical ? L.cx : 1420 * u];
    const sy = L.vertical ? [700 * u, 1000 * u, 1300 * u] : [520 * u, 520 * u, 520 * u];
    const stageW = L.vertical ? 700 * u : 300 * u;
    STATIONS.forEach((s, i) => L.vertical ? roller(g, sx[i] - stageW / 2, sy[i], stageW, s, sm(t, 1.0 + i * 0.3, 1.6 + i * 0.3), L, t >= [2.0, 8.0, 13.0][i] && t < [8.0, 13.0, 19.0][i]) : gate(g, sx[i], sy[i], s, sm(t, 1.0 + i * 0.3, 1.6 + i * 0.3), L, t >= [2.0, 8.0, 13.0][i] && t < [8.0, 13.0, 19.0][i]));
    // the two documents: raw → parsed → canonical → sealed
    const yA = L.vertical ? 330 * u : 300 * u, yB = L.vertical ? 330 * u : 560 * u;
    const xRaw = L.vertical ? L.m : 160 * u;
    const phase = t < 2.0 ? 0 : t < 8.0 ? 1 : t < 13.0 ? 2 : 3;
    const move = i => sm(t, [0, 2.0, 8.0, 13.0][i], [0, 3.2, 9.2, 14.2][i], eio);
    // horizontal travel (master) or vertical travel (vertical)
    const px = (base, i) => L.vertical ? base : lerp(lerp(lerp(xRaw, sx[0] - cw / 2, move(1)), sx[1] - cw / 2, move(2)), sx[2] - cw / 2, move(3));
    const py = (base) => L.vertical ? lerp(lerp(lerp(base, sy[0] - ch - 40 * u, move(1)), sy[1] - ch - 40 * u, move(2)), sy[2] - ch - 40 * u, move(3)) : base;
    const merged = sm(t, 9.6, 10.6, eio);           // after canonicalize, the two cards become one
    const xA = px(xRaw), xB = px(xRaw);
    const yAc = py(yA), yBc = py(yB);
    const yMid = (yAc + yBc) / 2;
    const yA2 = lerp(yAc, yMid, merged), yB2 = lerp(yBc, yMid, merged);
    const xA2 = L.vertical ? lerp(L.m, L.cx - cw / 2, merged) : xA, xB2 = L.vertical ? lerp(L.W - L.m - cw, L.cx - cw / 2, merged) : xB;
    const parsedA = 'amount → 1.0 (float)\nto → "acct-7"', parsedB = 'to → "acct-7"\namount → 1 (int)';
    const bodyA = phase <= 1 && t < 4.0 ? RAW_A : phase < 2 ? parsedA.split('\n')[0] : CANON;
    const bodyB = phase <= 1 && t < 4.0 ? RAW_B : phase < 2 ? parsedB.split('\n')[0] : CANON;
    const digA = t < 4.0 ? D_A : t < 9.6 ? null : D_C, digB = t < 4.0 ? D_B : t < 9.6 ? null : D_C;
    const sealed = t >= 14.6;
    card(g, xB2, yB2 + 4 * u, cw, ch, bodyB, digB, 1, L, { title: 'RECEIPT B · bytes as received', bodySize: L.vertical ? 15 * u : 16 * u, digestColor: sealed ? TOK.evidence : TOK.paperInk });
    card(g, xA2, yA2, cw, ch, bodyA, digA, 1, L, { title: merged >= 1 ? 'RECEIPT A = RECEIPT B · canonical bytes' : 'RECEIPT A · bytes as received', bodySize: L.vertical ? 15 * u : 16 * u, digestColor: sealed ? TOK.evidence : TOK.paperInk });
    // second parsed line under the cards during parse
    if (t >= 4.0 && t < 9.6) {
      text(g, parsedA.split('\n')[1], xA2 + 18 * u, yA2 + 92 * u, { font: 'mono', size: 16 * u, color: TOK.paperInk, alpha: sm(t, 4.0, 4.4), maxW: cw - 30 * u });
      text(g, parsedB.split('\n')[1], xB2 + 18 * u, yB2 + 96 * u, { font: 'mono', size: 16 * u, color: TOK.paperInk, alpha: sm(t, 4.0, 4.4), maxW: cw - 30 * u });
    }
    // the ≠ between raw digests, the = after
    const neq = win(t, 0.5, 4.0, 0.3, 0.3);
    text(g, '≠', L.vertical ? L.cx : xA + cw / 2, L.vertical ? yA + ch + 50 * u : (yA + yB) / 2 + 115 * u, { font: 'serif', size: 60 * u, color: TOK.review, align: 'center', alpha: neq });
    text(g, 'different bytes: 1.0 vs 1, keys in a different order', L.vertical ? L.cx : xA + cw / 2 + 60 * u, L.vertical ? yA + ch + 90 * u : (yA + yB) / 2 + 118 * u, { font: 'mono', size: 15 * u, color: TOK.review, align: 'center', alpha: neq, track: 0.03, maxW: 600 * u });
    // seal
    const sA = sm(t, 14.6, 15.4, eo3);
    if (sA > 0) {
      const cx = L.vertical ? L.cx : sx[2] + cw / 2 + 90 * u, cy = L.vertical ? sy[2] + 130 * u : 520 * u;
      ring(g, cx, cy, 64 * u, TOK.evidence, 4 * u, sA); ring(g, cx, cy, 52 * u, TOK.evidence, 1.5 * u, sA);
      text(g, 'sha256', cx, cy - 6 * u, { font: 'mono', size: 12 * u, color: TOK.evidence, align: 'center', alpha: sA, track: 0.16 });
      text(g, D_C.slice(0, 8), cx, cy + 16 * u, { font: 'mono', size: 16 * u, color: TOK.evidence, align: 'center', alpha: sA, track: 0.06 });
    }
    const tA = sm(t, 15.6, 16.4, eo3);
    text(g, 'Two documents. One digest.', L.cx, L.vertical ? L.H - 340 * u : 900 * u, { font: 'serif', size: 60 * u, weight: 500, color: TOK.ink, align: 'center', alpha: tA, maxW: L.W - 2 * L.m });
    text(g, 'everything the pipeline cannot tell apart is its kernel. the receipt inherits it.', L.cx, L.vertical ? L.H - 290 * u : 948 * u, { font: 'mono', size: 16 * u, color: TOK.muted, align: 'center', alpha: sm(t, 16.6, 17.2), track: 0.03, maxW: L.W - 2 * L.m });
    ledgerTag(g, L, 'CONSTRUCTED EXAMPLE', 'the film’s own toy canonicalizer (sort keys, whole floats → ints) · real SHA-256 over the bytes shown, computed at bind time · not Ghost-Ark’s canonicalizer', sm(t, 0.5, 1.0), 'right');
    return;
  }
  // ---- act 2: the boundary ----
  const a = sm(t, T_CUT, T_CUT + 0.4);
  kicker(g, 'A VERIFIED RECEIPT · AND THE EDGE OF WHAT IT PROVES', L.m + 20 * u, L.vertical ? 150 * u : 120 * u, { size: 18 * u, maxW: L.W - 2 * L.m });
  const cx = L.vertical ? L.cx : 420 * u, cy = L.vertical ? 520 * u : 520 * u;
  // the seal's light
  const spread = sm(t, T_CUT + 0.5, T_CUT + 3.0, eo3);
  const bx = L.vertical ? null : 860 * u;   // the boundary (master: vertical line; vertical: horizontal line)
  const by = L.vertical ? 900 * u : null;
  const reach = L.vertical ? lerp(0, by - cy, spread) : lerp(0, bx - cx, spread);
  g.save();
  const gl = g.createRadialGradient(cx, cy, 20 * u, cx, cy, Math.max(30 * u, reach + 60 * u));
  gl.addColorStop(0, hexA(TOK.evidence, 0.28)); gl.addColorStop(0.7, hexA(TOK.evidence, 0.10)); gl.addColorStop(1, hexA(TOK.evidence, 0));
  g.fillStyle = gl;
  g.beginPath();
  if (L.vertical) g.rect(0, 0, L.W, by); else g.rect(0, 0, bx, L.H);
  g.fill();
  g.restore();
  ring(g, cx, cy, 78 * u, TOK.evidence, 5 * u, a); ring(g, cx, cy, 64 * u, TOK.evidence, 1.5 * u, a);
  text(g, 'sha256', cx, cy - 10 * u, { font: 'mono', size: 13 * u, color: TOK.evidence, align: 'center', alpha: a, track: 0.16 });
  text(g, D_C.slice(0, 8), cx, cy + 16 * u, { font: 'mono', size: 18 * u, color: TOK.evidence, align: 'center', alpha: a, track: 0.06 });
  stamp(g, 'VERIFIED · CANONICAL BYTES MATCH', cx, cy + 130 * u, { size: 17 * u, color: TOK.evidence, alpha: sm(t, T_CUT + 0.6, T_CUT + 1.1), angle: -0.05 });
  text(g, 'what the seal proves: the canonical bytes are these bytes.', cx, cy + 190 * u, { font: 'sans', size: 22 * u, weight: 500, color: TOK.ink, align: 'center', alpha: sm(t, T_CUT + 1.2, T_CUT + 1.8), maxW: L.vertical ? L.W - 2 * L.m : 700 * u });
  // the boundary line
  const bA = sm(t, T_CUT + 2.6, T_CUT + 3.2);
  if (L.vertical) line(g, L.m, by, L.W - L.m, by, TOK.review, 3 * u, [12, 8]); else line(g, bx, 160 * u, bx, L.H - 120 * u, TOK.review, 3 * u, [12, 8]);
  text(g, 'the receipt proves nothing past this line', L.vertical ? L.cx : bx + 18 * u, L.vertical ? by - 16 * u : 190 * u, { font: 'mono', size: 15 * u, color: TOK.review, align: L.vertical ? 'center' : 'left', alpha: bA, track: 0.06, maxW: 900 * u });
  // the three dark doors
  const doors = ['SAFE?', 'AUTHORIZED?', 'CORRECT?'];
  doors.forEach((d, i) => {
    const dA = sm(t, T_CUT + 3.2 + i * 0.3, T_CUT + 3.8 + i * 0.3);
    const dw = L.vertical ? 300 * u : 280 * u, dh = L.vertical ? 240 * u : 420 * u;
    const dx = L.vertical ? L.m + 30 * u + i * (dw + 22 * u) : bx + 60 * u + i * (dw + 30 * u), dy = L.vertical ? by + 60 * u : 300 * u;
    g.save(); g.globalAlpha *= dA;
    g.fillStyle = TOK.surface; g.fillRect(dx, dy, dw, dh);
    dashRect(g, dx, dy, dw, dh, TOK.lineStrong, [8, 6], 2 * u);
    text(g, d, dx + dw / 2, dy + dh / 2 - 6 * u, { font: 'serif', size: L.vertical ? 32 * u : 34 * u, weight: 500, color: TOK.muted, align: 'center', maxW: dw - 16 * u });
    text(g, 'not established', dx + dw / 2, dy + dh / 2 + 30 * u, { font: 'mono', size: 13 * u, color: TOK.muted, align: 'center', track: 0.1, maxW: dw - 20 * u });
    text(g, 'by the receipt', dx + dw / 2, dy + dh / 2 + 52 * u, { font: 'mono', size: 13 * u, color: TOK.muted, align: 'center', track: 0.1, maxW: dw - 20 * u });
    g.restore();
  });
  // the registered non-claim, verbatim
  const qA = sm(t, 25.0, 25.8, eo3);
  const qy = L.vertical ? L.H - 520 * u : 830 * u;
  paragraph(g, `“${NONCLAIMS[0]}.”`, L.m + 20 * u, qy, { font: 'serif', size: L.vertical ? 30 * u : 34 * u, style: 'italic', color: TOK.ink, alpha: qA, maxW: L.W - 2 * L.m - 40 * u, lineHeight: (L.vertical ? 30 : 34) * u * 1.35 });
  paragraph(g, `registered non-claim GA-001 · Ghost-Ark thesis (S2 Lab, Penn State) bound at ${COMMIT.slice(0, 8)} · cited, not built upon`, L.m + 20 * u, L.vertical ? L.H - 380 * u : 940 * u, { font: 'mono', size: 14 * u, color: TOK.muted, alpha: sm(t, 26.2, 26.8), maxW: L.W - 2 * L.m - 40 * u, lineHeight: 20 * u });
  ledgerTag(g, L, 'DOCUMENT · CONSTRUCTED EXAMPLE', 'the boundary sentence is quoted verbatim from the registry; the seal is the film’s own example; no deployed receipt system is described', sm(t, T_CUT + 4.0, T_CUT + 4.6), 'right');
  locator(g, L, [`GA-001 · example digests by scripts/films/bind_facts.py · thesis @ ${COMMIT.slice(0, 8)}`, 'cubits11.github.io/modules/003-kernel-of-a-receipt'], sm(t, 30.4, 31.0));
}

Film.define({
  id: 'what-the-seal-proves', title: 'What the Seal Proves',
  duration: DUR, fps: 30, poster_t: 24.0,
  claimFrames: [
    { t: 16.8, label: 'two receipts with different raw digests now share one canonical digest under the seal' },
    { t: 24.0, label: 'the verified seal, the boundary line, and the three dark doors: SAFE? AUTHORIZED? CORRECT? — not established by the receipt' }
  ],
  setup, render
});
</script>
