objects:
- object: the two 100-item grids and each guard miss identity
  status: ILLUSTRATIVE
- object: the fixed Guard A and Guard B miss counters, each 10/100
  status: REGISTRY
  note: the declared input of CC-001; both denominators remain 100 in every frame
- object: the shared-miss count running 0 to 10
  status: PROVED
  note: the endpoints are CC-004 witnesses; each intermediate integer is feasible by the same construction
- object: the permitted range 0% to 10%
  status: PROVED
  note: CC-001 bounds
- object: the independence choice at 1%
  status: DERIVED
