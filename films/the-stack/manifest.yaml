evidence_commits:
- claim: CC-001
  repo: Cubits11/cc-framework
  commit: 167aa1ee514ee3d797ed9be2c60120d0c1db71f6
- claim: CC-004
  repo: Cubits11/cc-framework
  commit: 167aa1ee514ee3d797ed9be2c60120d0c1db71f6
falsifier: A clean-clone execution of the bound kernel on marginals (0.10, 0.10) returns AND bounds other than
  [0.0, 0.10], or a witness that fails a marginal check at tolerance 1e-9 (CC-001 / CC-004, REJECT); or any
  rendered frame changes a guard miss counter from 10/100 while the shared count moves, or depicts sequential
  rather than full 100-item exposure.
non_claims:
- does not certify any stacked system as safe, and shows no measured system
- does not estimate or recover the true dependence between any two guards
- does not select a point inside the interval; the amber point is what one assumption would select
- does not depict sequential routing; a second guard that never sees what the first blocked is a different
  estimand
- the items and the migration order are illustrations of feasible worlds, not data
claim_frames:
- t: 0.5
  shows: parallel branches each receive all 100 items; both miss counts fixed at 10/100
- t: 8.0
  shows: Guard A misses ten of its full 100-item exposure
- t: 14.0
  shows: Guard B also sees all 100 items; its ten misses are disjoint from A, shared count zero
- t: 22.0
  shows: B miss identities migrate; shared misses increase while both denominators stay 100
- t: 27.5
  shows: both guards miss the same ten items, shared count 10/100
- t: 33.0
  shows: permitted range 0–10%, with independence explicitly selecting 1%
- t: 43.0
  shows: fixed full-exposure denominators and shared-miss range remain visible
