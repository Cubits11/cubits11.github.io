id: the-stack
title: The Stack
cohort: B
grammar: two parallel evaluation branches receive the same one hundred items; the overlap tray counts shared
  misses
duration_s: 45
thesis: Two guards that each miss 10 of the same 100 items can share anywhere from 0 to 10 misses. Both denominators
  remain 100 as the shared count changes; independence selects one possible world.
epistemic_operation: fixed marginals with moving overlap → a set of feasible worlds; endpoint witnesses; an
  assumption selecting one point — staged as the deployer's own mental model, a stack
claim: For marginals (0.10, 0.10) the both-fail probability is identified only to [0.0, 0.10]; both endpoints
  are attained by explicit joint distributions that satisfy the marginals; independence names 0.01, a point
  inside that set it was never entitled to.
scope: A declared illustrative input (CC-001) and the kernel bounds and witnesses (CC-001, CC-004), reproduced
  from a clean clone in CI. Both parallel branches receive the same 100 items. Which items each guard misses
  and the migration order are illustrative constructions; no measured system appears. Sequential routing where
  the second guard never sees what the first stopped is a different estimand and is not shown.
status: supported_within_scope — bound to CC-001 and CC-004 at their registered commit
