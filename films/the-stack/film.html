<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>The Stack</title>
<link rel="stylesheet" href="../lib/tokens.css">
<!-- Two parallel full-exposure branches. Every guard sees the same 100
     illustrative items; no item is routed from one guard into the other. -->
<div id="stage"></div>
<script src="../lib/film.js"></script>
<script>
'use strict';
const { H, TOK } = Film;
const { k, eio, lerp, text, line, disc, ring, shuffled } = H;
const DUR = 45, N = 100, SIDE = 10;
const T_HOP0 = 17, HOP = 0.9, HOP_DUR = 0.5;
let P1, P2, LO, HI, IND, A_CELLS, B_HOME;
function setup({ fact }) {
  [P1, P2] = fact('CC-001.marginals');
  [LO, HI] = fact('CC-001.and_bounds');
  IND = fact('CC-001.independence_and');
  fact('CC-004.witness_lower'); fact('CC-004.witness_upper');
  const cells = shuffled([...Array(N).keys()], 0xC0FFEE);
  A_CELLS = cells.slice(0, Math.round(P1 * N));
  B_HOME = cells.slice(Math.round(P1 * N), Math.round((P1 + P2) * N));
}
const hopU = (t, i) => eio(k(t, T_HOP0 + i * HOP, T_HOP0 + i * HOP + HOP_DUR));
const landed = t => B_HOME.reduce((n, _, i) => n + (hopU(t, i) >= 1 ? 1 : 0), 0);
const xy = (i, x, y, c) => [x + (i % SIDE + 0.5) * c, y + (Math.floor(i / SIDE) + 0.5) * c];
function branch(g, x, y, c, guard, t) {
  const w = c * SIDE;
  g.fillStyle = TOK.paper; g.fillRect(x - 12, y - 12, w + 24, w + 24);
  for (let i = 0; i <= SIDE; i++) {
    line(g, x + i * c, y, x + i * c, y + w, TOK.paperLine, 1);
    line(g, x, y + i * c, x + w, y + i * c, TOK.paperLine, 1);
  }
  for (let i = 0; i < N; i++) { const [cx, cy] = xy(i, x, y, c); disc(g, cx, cy, c * 0.08, TOK.paperMuted); }
  if (guard === 'A') A_CELLS.forEach(cell => { const [cx, cy] = xy(cell, x, y, c); disc(g, cx, cy, c * 0.24, TOK.paperInk); });
  else B_HOME.forEach((home, i) => {
    const u = hopU(t, i), [hx, hy] = xy(home, x, y, c), [ax, ay] = xy(A_CELLS[i], x, y, c);
    ring(g, lerp(hx, ax, u), lerp(hy, ay, u) - Math.sin(u * Math.PI) * c * 0.5, c * 0.32, TOK.paperInk, 3.5);
  });
}
function render(t, g, L) {
  const phone = L.vertical, W = L.W, mid = W / 2;
  // 54px / 1080px * 280px = 14 CSSpx at a 320px viewport.
  const size = phone ? 54 : 34;
  const label = (s, x, y, o = {}) => text(g, s, x, y, { font: 'sans', size, color: TOK.ink, maxW: W - 160, ...o });
  label('Illustration — no measured system', 80, phone ? 88 : 66, { color: TOK.review });
  text(g, 'Both guards see all 100 items.', mid, phone ? 210 : 160, { font: 'serif', size: phone ? 66 : 70, weight: 500, align: 'center', maxW: W - 120 });
  label('Same items. Parallel evaluations.', mid, phone ? 300 : 225, { align: 'center', color: TOK.muted });
  const cell = phone ? 38 : 37, gridW = SIDE * cell;
  const xA = phone ? 90 : 410, xB = phone ? 610 : 1140;
  const cyA = xA + gridW / 2, cyB = xB + gridW / 2;
  const sourceY = phone ? 410 : 280, forkY = phone ? 490 : 320;
  label('100 items', mid, sourceY, { align: 'center', color: TOK.evidence });
  line(g, mid, sourceY + 20, mid, forkY, TOK.evidence, 4);
  line(g, mid, forkY, cyA, forkY, TOK.evidence, 4);
  line(g, mid, forkY, cyB, forkY, TOK.evidence, 4);
  const headY = phone ? 590 : 400, gridY = phone ? 650 : 440;
  line(g, cyA, forkY, cyA, headY - 62, TOK.evidence, 4);
  line(g, cyB, forkY, cyB, headY - 62, TOK.evidence, 4);
  label('Guard A', cyA, headY, { align: 'center' }); label('Guard B', cyB, headY, { align: 'center' });
  branch(g, xA, gridY, cell, 'A', t); branch(g, xB, gridY, cell, 'B', t);
  const scoresY = gridY + gridW + (phone ? 100 : 80);
  label(`Misses ${Math.round(P1 * N)}/${N}`, cyA, scoresY, { align: 'center', size: phone ? 54 : 42 });
  label(`Misses ${Math.round(P2 * N)}/${N}`, cyB, scoresY, { align: 'center', size: phone ? 54 : 42 });
  label('Fixed', cyA, scoresY + 66, { align: 'center', color: TOK.evidence });
  label('Fixed', cyB, scoresY + 66, { align: 'center', color: TOK.evidence });
  const q = landed(t), bothY = phone ? 1330 : 1000;
  if (phone) {
    line(g, cyA, scoresY + 100, cyA, bothY - 100, TOK.lineStrong, 4);
    line(g, cyB, scoresY + 100, cyB, bothY - 100, TOK.lineStrong, 4);
    line(g, cyA, bothY - 100, cyB, bothY - 100, TOK.lineStrong, 4);
    label(`Shared misses: ${q}/${N}`, mid, bothY, { align: 'center', size: 68 });
    for (let i = 0; i < Math.round(HI * N); i++) {
      const x = 160 + i * 84;
      if (i < q) disc(g, x, 1425, 24, TOK.invalid); else ring(g, x, 1425, 24, TOK.lineStrong, 3);
    }
    label('Only which items changes.', mid, 1525, { align: 'center', color: TOK.muted });
    if (t >= 30) {
      label(`Permitted range: ${H.pct(LO)}–${H.pct(HI)}`, 80, 1590, { color: TOK.evidence, size: 54 });
      label(`Independence picks ${H.pct(IND)}.`, 80, 1660, { color: TOK.review });
      label('One assumption; one point.', 80, 1730, { color: TOK.review });
    } else {
      label('Count the items both guards miss.', 80, 1650, { color: TOK.evidence });
      label('Neither input is filtered.', 80, 1740, { color: TOK.muted });
    }
    label('CC-001 / CC-004', 80, 1805, { color: TOK.muted });
    label('cubits11.github.io/try', 80, 1875, { color: TOK.gold });
  } else {
    const qText = t >= 30 ? `Shared misses: ${q}/${N} · permitted range ${H.pct(LO)}–${H.pct(HI)}` : `Shared misses: ${q}/${N} · both scored on all ${N}`;
    label(qText, mid, bothY, { align: 'center', size: 50, color: TOK.evidence });
    if (t >= 30) label(`Independence picks ${H.pct(IND)} — one assumption, one point.`, mid, 1060, { align: 'center', color: TOK.review });
    else label('CC-001 / CC-004 · cubits11.github.io/try', mid, 1060, { align: 'center', color: TOK.gold });
  }
}
Film.define({
  id: 'the-stack', title: 'The Stack', duration: DUR, fps: 30, poster_t: 29,
  claimFrames: [
    { t: 0.5, label: 'parallel branches each receive all 100 items; both miss counts are fixed at 10/100' },
    { t: 8, label: 'Guard A misses ten of its full 100-item exposure' },
    { t: 14, label: 'Guard B also sees all 100 items; its ten misses are disjoint from A, shared count zero' },
    { t: 22, label: 'B miss identities migrate; shared misses increase while both denominators stay 100' },
    { t: 27.5, label: 'both guards miss the same ten items, shared count 10/100' },
    { t: 33, label: 'permitted range 0–10%, with independence explicitly selecting 1%' },
    { t: 43, label: 'fixed full-exposure denominators and shared-miss range remain visible' }
  ], setup, render
});
</script>
