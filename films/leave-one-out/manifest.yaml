id: leave-one-out
title: Leave One Out
cohort: A
grammar: light — eighty-two windows, five lamps, one shutter at a time
duration_s: 34
thesis: >
  Marginal catch counts plus the union only bound what each guard alone
  catches; the released leave-one-out unions identify it — 18, 3, 0, 0, 0 —
  so three of five supervisors add no exclusive coverage on this stratum.
epistemic_operation: >
  aggregate-only bounds (marginals + union) versus identification by k
  leave-one-out scalars; what a second guardrail catches that the others miss.
claim: >
  On the 82 prompts labelled harmful in the released BELLS subset, the OR of
  released verdicts flags 73; removing NeMo Guardrails leaves 55 flagged
  (exclusive coverage 18), removing Lakera Guard leaves 70 (3), and removing
  LangKit, Prompt Guard, or LLM Guard leaves 73 (0). From catch counts and
  the union alone those exclusive counts are only bounded: NeMo 0–21, Lakera
  0–3, LangKit 0–3, Prompt Guard 0–3, LLM Guard 0.
scope: >
  Exactly the released file at the bound commit; counting arithmetic at the
  vendors' released binary verdicts. The lamp counts, union, and leave-one-out
  unions are registered values re-asserted against the hash-verified file in
  CI (MC-002); the bounds are MC-003's. Which windows each lamp lights is a
  construction satisfying every registered count and all five leave-one-out
  unions; the released rows are never redistributed, and pairwise overlaps
  are neither registered nor claimed.
status: supported_within_scope — bound to MC-002 and MC-003; window positions constructed
evidence:
  - {fact: MC-002.n_harmful, kind: OBSERVED, value: 82}
  - {fact: MC-002.guards, kind: REGISTRY, value: [lakera_guard, prompt_guard, langkit, nemo, llm_guard]}
  - {fact: MC-002.guard_labels, kind: REGISTRY, value: {lakera_guard: Lakera Guard, prompt_guard: Prompt Guard, langkit: LangKit, nemo: NeMo Guardrails, llm_guard: LLM Guard}}
  - {fact: MC-002.per_guard_catches, kind: OBSERVED, value: {lakera_guard: 52, prompt_guard: 5, langkit: 25, nemo: 70, llm_guard: 0}}
  - {fact: MC-002.union_detection, kind: OBSERVED, value: 73}
  - {fact: MC-002.all_miss, kind: OBSERVED, value: 9}
  - {fact: MC-002.leave_one_out_union, kind: OBSERVED, value: {lakera_guard: 70, prompt_guard: 73, langkit: 73, nemo: 55, llm_guard: 73}}
  - {fact: MC-002.exclusive_full_stack_coverage, kind: DERIVED, value: {lakera_guard: 3, langkit: 0, llm_guard: 0, nemo: 18, prompt_guard: 0}}
