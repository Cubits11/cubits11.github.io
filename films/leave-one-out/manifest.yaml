objects:
  - object: the five lamps with catch counts, the lit total 73/82, the 9 dark windows
    status: OBSERVED
    note: MC-002 registered counts, re-asserted against the hash-verified release in CI
  - object: which window each lamp lights
    status: CONSTRUCTED
    note: 82 five-bit masks satisfying per-guard catches, the union, and all five leave-one-out unions, then a seeded shuffle of positions
  - object: the aggregate-only bounds beside each lamp (0–21, 0–3, …)
    status: PROVED
    note: MC-003 expected block, checked by scripts/identification.py
  - object: the windows that go dark under each shutter (18, 3, 0, 0, 0)
    status: DERIVED
    note: union − leave-one-out union; identical to the count on the constructed wall by construction
evidence_commits:
  - claim: MC-002
    repo: CentreSecuriteIA/bells_leaderboard
    commit: 507566c5a4606c8e3dec0bd59a5c5fde62594951
falsifier: >
  Recomputing from the bound, hash-verified file yields any per-guard catch,
  union, or leave-one-out union different from the expected block (MC-002,
  REJECT); or an exact finite catch-set arrangement lies outside the stated
  exclusive-coverage bounds (MC-003, REJECT); or the constructed wall fails
  any registered count — bind_facts.py asserts every constraint before the
  film can read it.
non_claims:
  - not a vendor ranking, a causal attribution, or evidence about any product outside this stratum
  - the released verdicts are at unstated default configurations; one supervisor fires exactly once in the released rows
  - leave-one-out unions identify exclusive full-stack coverage only; not pairwise or higher-order overlap, Shapley values, or ensemble structure
  - window positions are a construction; the released rows are not redistributed and the true overlaps beyond the registered aggregates are not shown
  - says nothing about adversarial prompts, which dominate the evaluation and have no per-item release
claim_frames:
  - t: 12.0
    shows: all five lamps on — 73/82 lit, 9 dark; aggregate-only bounds on exclusive coverage beside each lamp
  - t: 16.3
    shows: NeMo Guardrails shuttered — 18 windows go dark, 55/82 still lit by the other four
  - t: 29.0
    shows: the summary line — 3 of 5 lamps light nothing the others don't, on this stratum; identified values beside each lamp
