# The campaign ledger — every acquisition path this record deliberately opens.
#
# DISPATCH STATUS: HELD. This registry preserves prepared routes and outcome
# definitions; it is not authorization to post, schedule, contact, or measure
# a campaign. `docs/FRONTIER_ROADMAP.md` §5 currently declines new
# social/visual work. Any future dispatch requires separate owner approval and
# re-derivation at the dispatch commit.
#
# This file is the attribution source of truth. A link that is not built from a
# row here is not attributable, and an unattributable visit cannot be counted
# toward the first hundred qualified humans. scripts/verify_growth.py checks
# every row's shape, that its destination resolves to a committed page, and
# that the URL it produces is well-formed.
#
# What this file is NOT: a traffic report. It records what was published and
# where it pointed. Observed outcomes live in `observed:` and stay empty until
# a real number is read off a real source. Unknown remains unknown.

schema_version: 1
owner: "Pranav Bhave"
site: "https://cubits11.github.io"

# The measurement contract this ledger serves.
contract:
  question: >
    Did a real member of a target audience reach the record through a named
    path, and did they perform an intent action once here?
  # After E3.1 the sharper research question, because every zero can now be
  # localised to a layer rather than meaning "nothing happened":
  boundary_question: >
    At which boundary does external work stop — exposure, comprehension,
    verification intent, execution, or institutional adoption?
  qualified_human: >
    A member of at least one target audience who arrives through an
    attributable source and performs one intent action: reads the flagship
    result, opens evidence or reproduction material, uses or copies the
    disclosure, visits the resume or work surface, or replies, emails, cites,
    stars, corrects, introduces, or requests a conversation.
  excluded: >
    Bots, purchased traffic, engagement pods, untargeted impressions, the
    owner's own visits, and follower growth without an intent action. None of
    these count, and none of them are reported as if they did.
  privacy_stance: >
    The site publishes no client-side analytics and sets no cookies, and that
    claim is load-bearing in its colophon. Nothing in this ledger changes it.
    Attribution here is built from campaign parameters that the destination
    platform and the owner's own referrer sources can read, not from anything
    the page does to a visitor. Adding any measurement endpoint would change a
    public claim about this site and is therefore a deliberate, separately
    reviewed act — never a side effect of a growth push.
  sources_available_without_new_instrumentation:
    - name: "GitHub repository traffic"
      gives: "referrers and view counts for the repository, 14-day rolling window"
      access: "repository Insights → Traffic; owner-authenticated"
      status: "not read in this run — requires owner-authenticated access"
    - name: "Platform post analytics"
      gives: "impressions, link clicks, and profile visits per post"
      access: "the posting account's own analytics view"
      status: "not read in this run — no post has been published yet"
    - name: "Direct human replies"
      gives: "the only unambiguous qualified-human signal available here"
      access: "email, issues, PRs, mentions, and citations"
      status: "counted by hand in `observed:` as they arrive"
  known_limits: >
    A static site on GitHub Pages exposes no server logs to its owner, so
    landing-page-level counts are not observable without instrumentation this
    record has chosen not to add. Campaign parameters therefore attribute at
    the source side (which post, which reply, which email) rather than the
    destination side. At n = 100 nothing here is statistically significant;
    every number this ledger ever reports is directional and labelled so.

# Campaign parameter vocabulary. Fixed, so two posts about the same thing are
# comparable and a typo is a verifier failure rather than a silent new bucket.
vocabulary:
  utm_source: [x, linkedin, hn, github, email, lobsters, reddit, direct]
  utm_medium: [social, reply, profile, outreach, forum, readme, signature]
  utm_campaign: [missing-column-launch, disclosure-adoption, work-with-me, e3-films]
  utm_content: []   # free text per row, validated as slug-shaped

# Destinations, by funnel stage. Every campaign row must name one of these.
destinations:
  flagship: "/missing-column/"
  proof: "/essays/when-marginals-are-not-enough/"
  disclosure: "/missing-column/disclosure/"
  census_rows: "/missing-column/#census"
  arithmetic: "/answers/why-guardrail-miss-rates-do-not-multiply/"
  evaluating: "/answers/how-to-evaluate-guardrails-you-plan-to-stack/"
  second_guard: "/answers/what-does-the-second-guardrail-add/"
  preflight: "/stack-study/"
  work: "/work/"
  resume: "/resume/"
  ledger: "/ledger/"
  ledger_mc003: "/ledger/#MC-003"
  corrections: "/corrections/"
  home: "/"
  try: "/try/"
  try_a: "/try/#try-a"
  try_counterexample: "/try/#counterexample"

# Baseline, established before anything ships. Observed values only.
baseline:
  established: "2026-08-30"
  method: >
    Read from this repository and this run. No live-site or platform figure
    was read: the sandbox executing this run cannot reach cubits11.github.io
    or any analytics surface, so every destination-side number below is
    recorded as unavailable rather than estimated.
  observed:
    published_campaign_links: 0
    qualified_visitors: unavailable
    flagship_evidence_actions: unavailable
    external_interactions: 0
    substantive_conversations: 0
    external_citations_or_uses: 0
  unavailable:
    - "live-site page views (no server logs, no analytics, egress-blocked here)"
    - "search impressions and queries (Search Console not connected in this run)"
    - "repository traffic referrers (requires owner-authenticated access)"

targets:
  window_days: 30
  starts: "2026-08-30"
  directional: true
  qualified_visitors: 100
  flagship_evidence_actions: 30
  external_interactions: 10
  substantive_conversations: 3
  external_uses: 1     # a citation, author response, correction, disclosure use, or reproduction
  note: >
    Operating targets, not predictions. At this scale, results are directional
    and must be labelled so; no significance is claimed or manufactured.

