  - id: x-identity-post
    audience: "all five target audiences"
    surface: x
    utm: {source: x, medium: social, campaign: missing-column-launch, content: pinned}
    destination: home
    intended_action: "understand what Pranav works on in one post"
    success_signal: "a follow from a target audience, or a question about the method"

  - id: x-evaluating-checklist
    audience: "evaluation designers"
    surface: x
