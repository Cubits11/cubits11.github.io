  # ---------------------------------------------------------------------------
  # E3 — film-to-experiment campaigns. PREREGISTERED: hypothesis, changed
  # variable, diagnostics, qualified target, window and decision rule are
  # written here before any post exists. Status is PREPARED until the owner
  # dispatches; the assistant posts nothing. One variable changes per campaign.
  # ---------------------------------------------------------------------------
  - id: x-film-same-scores
    audience: "AI evaluation researchers and guardrail engineers on X"
    surface: x
    utm: {source: x, medium: social, campaign: e3-films, content: same-scores}
    destination: try_a
    intended_action: "run TRY-A and file the result, match or mismatch"
    success_signal: "one reproduction issue filed by someone who is not the author"
    preregistered: true
    status: prepared
    design: ecological_descriptive
    design_note: >
      An organic post on one account cannot identify a creative effect:
      creative, time, current followers, ranking, network state, competing
      events and account history change together, and the platform's
      recommendation uses recent and long-term engagement features, so
      sequential posts do not have exchangeable audiences. This row asks an
      ecological question about the actual account and answers it
      descriptively. A causal creative comparison is possible later through
      the platform's randomized creative A/B facility (mutually exclusive
      audiences, two-week flights) — but that characterises promoted delivery
      to a chosen audience, not this organic researcher network, and is used
      only if this organic run establishes enough value to justify paying
      for identification.
    hypothesis: >
      Ecological question: released through the actual account, does the
      Same Scores feed object produce observable attention, verification
      intent, and external execution? Not: did video cause an improvement
      over prose.
    changed_representation: "the feed object itself (an 11-second square cut of one operation with one action)"
    changed_variable: "none identified causally; the object is released and observed"
    artifact: "films/same-scores__social-square/renders/same-scores__social-square__square.mp4"
    post_copy: "distribution/launch-units.yaml → unit same-scores__social-square → post_draft (link kept in the post: the objective is attributable technical action, not reach)"
    prerequisite: "cold comprehension gate passed (distribution/launch-units.yaml → cold_test_gate; ≥5 cold viewers; no repeated semantic failure)"
    measurement_layers:
      - {layer: exposure,              observable: "impressions",                       source: "X Post Activity Dashboard", meaning: "the platform served the post"}
      - {layer: attention,             observable: "video view rate",                    source: "X Video Activity Dashboard", meaning: "≥2 s at ≥50 % viewability, or expand/unmute, under the platform's definition"}
      - {layer: sustained_attention,   observable: "retention rate",                     source: "X Video Activity Dashboard", meaning: "average percentage watched"}
      - {layer: completed_attention,   observable: "completion rate",                    source: "X Video Activity Dashboard", meaning: "viewer finished the 11 s"}
      - {layer: verification_intent,   observable: "link clicks",                        source: "X Post Activity Dashboard", meaning: "a PROXY for intent; registered at click time, not a verified /try/ landing — the site tracks nothing"}
      - {layer: site_arrival,          observable: "UNKNOWN",                            source: "none (no site tracking)",   meaning: "not observable"}
      - {layer: experiment_start,      observable: "UNKNOWN",                            source: "none",                      meaning: "not observable"}
      - {layer: experiment_completion, observable: "voluntary reports only",             source: "issues",                    meaning: "external work"}
      - {layer: reproduction,          observable: "verified submitted result",          source: "distribution/outcomes.yaml", meaning: "QUALIFIED"}
    primary_diagnostic: "link clicks / impressions (verification-intent proxy), with view, retention and completion rates alongside; all with denominators"
    qualified_target: ">= 1 independent reproduction of TRY-A or TRY-B filed via the reproduction template"
    observation_window_days: 14
    snapshots:
      - {at: "T+36h", use: "primary stabilised initial snapshot — platform analytics may fluctuate for up to 36 h"}
      - {at: "T+7d",  use: "distribution tail + technical interactions"}
      - {at: "T+14d", use: "close the campaign"}
    no_touch_rules:
      - "before T+36h: look, do not change strategy on the numbers"
      - "do not delete, edit, repost, pin mid-window, or add hashtags"
      - "answer substantive technical questions naturally; manufacture nothing"
      - "a factual defect found by anyone outranks experimental cleanliness: correct it immediately and mark the campaign interrupted"
    decision_rule: >
      Read against the decision matrix (campaigns.yaml → decision_matrix)
      jointly with the IBM contribution. Low impressions do not indict the
      film: distribution can fail before enough humans encounter it; do not
      redesign Same Scores if the few who saw it understood it (cold trials).
      Clicks but no filed result cannot yet be localised (a click is not a
      verified landing): test reproduction and intake friction before the
      creative. High completion with near-zero clicks: the transition from
      film to action is weak. Poor watch and poor clicks: opening, audience
      or distribution. Likes are recorded and control nothing.

  - id: x-film-thirteen-worlds
    audience: "benchmark authors and people who have read the BELLS paper"
    surface: x
    utm: {source: x, medium: social, campaign: e3-films, content: thirteen-worlds}
    destination: try
    intended_action: "run TRY-B against the pinned released file"
    success_signal: "one TRY-B reproduction filed, or a BELLS author confirms or corrects the row"
    preregistered: true
    status: prepared
    design: descriptive
    hypothesis: >
      With a released-data film that names the file and the count (9 of 82)
      as the opening, more reconstruction attempts are observed than after
      the abstract-bounds film; the object is downloadable.
    changed_variable: "the film only (released-data bridge versus constructed proof); destination and CTA held fixed"
    primary_diagnostic: "TRY-B reproduction issues / landing visits"
    qualified_target: ">= 1 independent TRY-B reproduction, or 1 source correction from a BELLS author"
    observation_window_days: 14
    decision_rule: "as x-film-same-scores; a mismatch is handled as a correction the same day and is a success of the route, not a failure of the film"

  - id: x-film-parity-cube
    audience: "researchers in dependence, identification and evaluation methodology"
    surface: x
    utm: {source: x, medium: social, campaign: e3-films, content: parity-cube}
    destination: try
    intended_action: "run TRY-A with their own marginals; challenge the higher-order claim"
    success_signal: "a substantive methodological counterexample or a reproduction filed"
    preregistered: true
    status: prepared
    design: descriptive
    hypothesis: "With a proof-object film, replies from a methods audience are observed that the census film did not draw; the diagnostic is who replies, not how many"
    changed_variable: "audience only; film format held to the same grammar (a constructed proof)"
    primary_diagnostic: "technical replies carrying a derivation, number, or counterexample / total replies"
    qualified_target: ">= 1 counterexample issue or reproduction filed"
    observation_window_days: 14
    decision_rule: "as x-film-same-scores"

  - id: x-film-missing-column-census
    audience: "authors of the twenty examined evaluations"
    surface: x
    utm: {source: x, medium: reply, campaign: e3-films, content: missing-column-census}
    destination: try_counterexample
    intended_action: "correct a row, or confirm it, or run TRY-C on another evaluation"
    success_signal: "one row correction, one author confirmation, or one TRY-C candidate row filed"
    preregistered: true
    status: prepared
    design: descriptive
    hypothesis: "Replying on an author's own announcement with their row and the correction route is followed by more corrections than broadcasts have been (one card per week; ml6-2026 stays on hold)"
    changed_variable: "channel only (reply on the author's thread versus broadcast); the ask is unchanged: if the row is wrong, say so"
    primary_diagnostic: "author replies / cards sent"
    qualified_target: ">= 1 source correction or author confirmation recorded in outcomes.yaml"
    observation_window_days: 28
    decision_rule: "a correction is the best outcome; silence after one card is the default and is not chased"

  - id: x-film-leave-one-out
    audience: "teams deciding whether to add a second detector"
    surface: x
    utm: {source: x, medium: social, campaign: e3-films, content: leave-one-out}
    destination: try
    intended_action: "run TRY-B; measure a leave-one-out union on their own stack"
    success_signal: "a reply describing a stack where a leave-one-out union was measured, or a paired-outcome release"
    preregistered: true
    status: prepared
    design: descriptive
    hypothesis: "With a decision-consequence film (what removing a guard costs) as the opening, more practitioner replies are observed than after a bounds film"
    changed_variable: "the film's operation (removal) only; destination and CTA held fixed"
    primary_diagnostic: "practitioner replies naming their own stack / landing visits"
    qualified_target: ">= 1 paired-outcome release or reproduction"
    observation_window_days: 14
    decision_rule: "as x-film-same-scores"

  - id: x-film-what-the-seal-proves
    audience: "provenance, attestation and receipt-system engineers"
    surface: x
    utm: {source: x, medium: social, campaign: e3-films, content: what-the-seal-proves}
    destination: ledger
    intended_action: "read GA-001 and its non-claims; challenge the boundary"
    success_signal: "a substantive reply about a real receipt system's kernel"
    preregistered: true
    status: prepared
    design: descriptive
    hypothesis: "The provenance film opens a separate sequence; its audience is expected not to overlap the guardrail audience, so it is not measured against the same funnel"
    changed_variable: "audience and topic — a separate sequence, not a variant of the guardrail experiment"
    primary_diagnostic: "replies from receipt/attestation engineers / total replies"
    qualified_target: "none pre-registered for this window; a Ghost-Ark-lab confirmation of the boundary sentence would count as a source correction or confirmation"
    observation_window_days: 28
    decision_rule: "do not fold into the guardrail funnel; report separately or not at all"

# Observed results. One row per reading, each naming where the number came
# from. Empty until a real source is read; an empty list is an honest baseline.
readings: []

# ---------------------------------------------------------------------------
# The conversion funnel (P4). No client-side analytics exist and none are
# added: every stage is read by the owner from platform-native sources and
# recorded here as a dated observation WITH its denominator and source. The
# interpretation table is mechanical so the diagnosis cannot be argued after
# the fact. Stages, in order:
# ---------------------------------------------------------------------------
funnel:
  stages:
    - {id: exposure,          source: "X analytics impressions; LinkedIn impressions",         reads: "impressions"}
    - {id: film_view,         source: "X video views (or link clicks to the film)",             reads: "views"}
    - {id: research_visit,    source: "GitHub Insights → Traffic referrers (14-day window)",    reads: "referred visits"}
    - {id: try_visit,         source: "GitHub Insights → Traffic; /try/ is a Pages route, so only repository referrals are observable", reads: "referred visits (proxy)"}
    - {id: experiment_start,  source: "unobservable without instrumentation; counted only when a reporter says so", reads: "self-reported"}
    - {id: completion,        source: "reproduction issues (match or mismatch)",                 reads: "issues filed"}
    - {id: result_submitted,  source: "issues with the reproduction or counterexample template", reads: "issues filed"}
    - {id: qualified_outcome, source: "distribution/outcomes.yaml (verified entries only)",    reads: "entries"}
  interpretation:
    - {pattern: "high exposure, low film_view or research_visit", diagnosis: "hook or audience failure", change: "audience or opening representation — one at a time"}
    - {pattern: "research_visit but few try_visit", diagnosis: "landing-page or friction failure", change: "one element of the landing page's route to /try/"}
    - {pattern: "experiment starts but few completions", diagnosis: "reproduction failure", change: "the reproduction path (P0), never the copy"}
    - {pattern: "completions but few results submitted", diagnosis: "result-intake failure", change: "the report route or template"}
    - {pattern: "technical discussion but no execution", diagnosis: "the CTA asks for thought rather than work", change: "the CTA to a command"}
    - {pattern: "external rerun, correction, release, or PR", diagnosis: "qualified consequence", change: "record it in outcomes.yaml; then decide"}
  # The first transition the record cannot observe. Everything up to a /try/
  # visit leaves a trace somewhere (impressions, referrals); whether a visitor
  # then runs a command leaves none until they file a result. So:
  first_unobserved_transition: "try_visit → experiment_start"
  bottleneck_location: "UNKNOWN until external evidence arrives"
  # Dated observations, appended by the owner, never estimated. Each names the
  # stage, the campaign id, the numerator, the denominator, and the source.
  observations: []   # {date, campaign, stage, value, denominator, source, note}

# ---------------------------------------------------------------------------
# Decision matrix for the first two external experiments, written before
# either has an outcome. Read jointly; likes are recorded and control nothing.
# ---------------------------------------------------------------------------
decision_matrix:
  experiments: [ibm-contribution, x-film-same-scores]
  rows:
    - {ibm: qualified,            same_scores: qualified,                         update: "strong signal — reproduce both lanes: GuardBench next, and the next evidence-bound film only if evidence asks for one"}
    - {ibm: qualified,            same_scores: "attention, no reproduction",       update: "direct expert contribution works; public conversion unproven — prioritise upstream work"}
    - {ibm: no_observed_response, same_scores: "independent rerun",                update: "public discovery works; IBM silence is target-specific or censored — expand researcher distribution"}
    - {ibm: no_observed_response, same_scores: "clicks, no result",                update: "cannot localise yet (a click is not a verified landing) — test reproduction and intake friction"}
    - {ibm: no_observed_response, same_scores: "high completion, near-zero clicks", update: "the film holds attention; the film→action transition is weak"}
    - {ibm: no_observed_response, same_scores: "poor watch, poor clicks",          update: "opening, audience, or distribution is the candidate problem"}
    - {ibm: source_correction,    same_scores: any,                               update: "stop promotion of the affected claim; adjudicate immediately"}
    - {ibm: "0 qualified after adequate repeated exposure", same_scores: "0 qualified after adequate repeated exposure", update: "stop building media; shift to direct upstream contributions and cold applications of the protocol"}
  ibm_follow_up: "one follow-up at most, around week 2–3; afterwards retain NO_OBSERVED_RESPONSE — silence is never rewritten as rejection"
