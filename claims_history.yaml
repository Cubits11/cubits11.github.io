version: 1
kernel: E5A
purpose: Declared transitions or nothing. A registered claim's commitment (proposition, scope, falsifier,
  forbidden_rescues, non_claims, expected) may only change by appending a transition to this chain; scripts/claims_history.py
  verify fails any live commitment the chain does not predict, any edit to accepted history, and any re-minted
  genesis.
non_claim: This kernel detects undeclared commitment changes under the repository's current verification
  contract, from the genesis forward. It does not establish that an authorized actor cannot change the
  verifier, the workflow, repository history, branch protection, or the trust model itself; it protected
  nothing before the genesis; entries marked RETROSPECTIVE_RECONSTRUCTION are E5A's reading of git objects
  and dated records, not contemporaneous declarations.
canonicalization: 'commitment = {field: parsed value for field in (proposition, scope, falsifier, forbidden_rescues,
  non_claims, expected) if present on the claim}; json.dumps(sort_keys=True, separators=('','', '':''),
  ensure_ascii=False, allow_nan=False); UTF-8; SHA-256 hex'
commitment_fields:
- proposition
- scope
- falsifier
- forbidden_rescues
- non_claims
- expected
transition_types:
- CLARIFY
- CORRECT
- EXPAND
- NARROW
- RETRACT
- SUPERSEDE
provenance_classes:
- CONTEMPORANEOUS
- RETROSPECTIVE_RECONSTRUCTION
direction_bases:
- DECLARED_HUMAN_JUDGMENT
- MACHINE_CHECKED
- NOT_MACHINE_DECIDABLE
