  - claim_id: AF-001
    digest: 2a719230bd2c57ce675a1440556cd9ed0130e38dbb446454f3cd287c30dab7a5
    commitment:
      proposition: 'Anthropic''s AI Fluency Index reports overall prevalences for the 11 of its framework''s
        24 behaviours that are directly observable in conversations, and percentage-point differences
        for conversations that produced an artifact, but not the artifact share and not which comparison
        group the differences are against. Those published numbers therefore do not identify the subgroup
        rates — but they do bound them. Under every feasible artifact share and under either reading of
        the comparison, fact-checking is between 30% and 43% less prevalent in artifact conversations,
        a far larger effect than the stated 3.7 percentage points suggests on a base rate of 8.7%. The
        three behaviours that rise in artifact conversations are Description behaviours; the three that
        fall are Discernment behaviours.

        '
      scope: 'Arithmetic on the figures published in the Index summary, nothing more. A pooled rate is
        a mixture of its subgroups, so a stated overall rate and a stated between-group difference bound
        each subgroup rate and their ratio; scripts/mixture_bounds.py computes those bounds in closed
        form and cross-checks them against a sweep. This is a re-expression of published numbers on a
        relative scale, not a re-analysis of the underlying conversations, to which this record has no
        access. It inherits every limitation the report declares: the findings are correlational, and
        the report states that users may perform fluency behaviours mentally without expressing them conversationally
        — so a fall in transcript-visible checking cannot be separated from checking that moved off-platform,
        which is where checking an artifact ordinarily goes. The measured evaluation gap is confounded
        with a measurement gap and these numbers cannot separate them. The framework is CC BY-NC-SA 4.0,
        copyright 2025 Rick Dakan, Joseph Feller, and Anthropic PBC; it is cited and analysed here, never
        redistributed or productised.

        '
      falsifier:
        condition: 'The report states an artifact share or comparison group under which the relative reduction
          falls outside [30%, 43%]; or a published figure differs from the transcription; or the closed-form
          bound disagrees with a direct sweep over feasible shares.

          '
        consequence: NARROW
      forbidden_rescues:
      - do not widen the stated interval after the fact to accommodate a figure that falls outside it
      - do not restate the bound as an estimate of the artifact-conversation rate
      - do not present the Description-rises / Discernment-falls pattern as causal, or as evidence that
        artifacts reduce evaluation rather than relocate it
      - do not repackage the framework's behaviour taxonomy into any commercial or certification artifact;
        the licence is NonCommercial ShareAlike
      non_claims:
      - not a criticism of the Index; the observability boundary and the correlational limits are the
        report's own declared statements
      - not a claim about any individual's competence, and not a measure of anyone's diligence
      - not evidence that artifact production causes less checking — the published marginals cannot separate
        a behaviour change from a measurement change
      - no access to the underlying conversations; this is arithmetic on a published summary
      expected:
        n_conversations: 9830
        behaviours_total: 24
        behaviours_observable: 11
        checks_facts_overall_pct: 8.7
        checks_facts_artifact_diff_pp: -3.7
        checks_facts_reduction_min_pct: 29
        checks_facts_reduction_max_pct: 43
        behaviours_rising: 3
        behaviours_falling: 3
  - claim_id: GA-001
    digest: 49acc16aadaaaefea0aadc537b0ed22dfda3accaf68d8e960ed0ed68e1c25f6e
    commitment:
      proposition: 'Ghost-Ark is a verifier and measurement harness for the provenance limits of AI-governance
        receipts — a research artifact of the S2 Lab, Penn State — whose stated thesis is that receipt
        soundness is a ternary relation Sound(C, Σ, P): a receipt identifies an execution only up to the
        kernel of its whole parse → canonicalize → digest pipeline, so soundness does not persist by default
        as the pathology alphabet grows or the consumer set widens.

        '
      scope: The repository README and thesis document at the bound commit.
      falsifier:
        condition: 'A source-level review of the bound thesis shows that it does not state soundness as
          a ternary relation over the whole parse → canonicalize → digest pipeline, or does not identify
          Ghost-Ark as the stated S2 Lab research artifact.

          '
        consequence: NARROW
      forbidden_rescues:
      - do not replace a whole-pipeline claim with a canonicalizer-only claim after the condition fires
      - do not treat verifier acceptance or a pathology-free sample as evidence of semantic safety, authorization,
        or correctness
      non_claims:
      - a verifying receipt does not establish that the governed action was safe, authorized, or semantically
        correct
      - kernel collisions in real canonicalizers are demonstrated as possible, not as prevalent — the
        repository's E12 sample found 0 of 64 real payloads carrying any pathology class
      - not hardened for deployment; not post-quantum secure
  - claim_id: GV-001
    digest: 33ecb8570400b2a500739f2ed993fb44a1e4ffb737692b51b09b1f87853f5c0f
    commitment:
      proposition: 'Ghost Visualizer is a seven-scene React/Vite visual essay ("Why AI Safety Scores Lie")
        that computes marginals, OR composition, Fréchet–Hoeffding bounds, endpoint witnesses, and a receipt
        object from deterministic sample rows, with an Evidence Mode for inspection.

        '
      scope: 'The repository at the bound commit. Runs locally; there is no hosted deployment, so the
        site links source, not a live demo.

        '
      falsifier:
        condition: 'A local run from the bound revision lacks the stated seven scenes, deterministic sample-row
          computations, or Evidence Mode for inspection.

          '
        consequence: NARROW
      forbidden_rescues:
      - do not count hard-coded or mocked screenshots as deterministic computations
      - do not recast a local-only source project as a hosted interactive demo
      non_claims:
      - not an AI-safety certificate; no deployment-readiness claim
      - its own public-readiness review scores it for private serious-contact demo use; the site therefore
        links source rather than exhibiting its media as a flagship
  - claim_id: GCE-001
    digest: 06ec07bb8b9abb11424fa2e1058ffde1389b2cbddb8d784673edc3d4ce68e347
    commitment:
      proposition: 'GCE — the Guardrail Composability Explorer — is a coursework MVP demo (AI-285) for
        toggling guardrails and observing composed behavior. Its front-door composability-coefficient
        framing is superseded by CC-Framework''s dependence-aware partial identification, whose metric
        taxonomy classifies the older coefficient family as legacy/deprecated. GCE is preserved as intellectual
        lineage, not current theory.

        '
      scope: 'The supersession record. It is bound to the superseding taxonomy document, not to GCE''s
        repository; GCE itself is linked from /archive/ as a historical artifact.

        '
      falsifier:
        condition: 'The bound superseding taxonomy no longer classifies the coefficient family as deprecated
          legacy, or no longer supports the stated dependence-aware supersession.

          '
        consequence: NARROW
      forbidden_rescues:
      - do not treat the existence of legacy code or UI as evidence that its framing remains current theory
      - do not substitute a generic preference for newer methods for a recorded theoretical supersession
      non_claims:
      - supersession is a statement about theoretical framing, not about the correctness of GCE's code
        or its value as coursework
      - no current-research claim is made by or for GCE
  - claim_id: SITE-001
    digest: 2d45c9927850ce2f2996d5abeacc1128186cf86c733ddfd804f3e313fcf3c977
    commitment:
      proposition: 'This site''s palette token pairs were computed to pass WCAG AA contrast (most AAA),
        and manual QA passes covered light/dark themes, desktop and mobile layouts, keyboard focus, reduced
        motion, and no-JS rendering, as recorded in DESIGN.md.

        '
      scope: 'Manual and scripted checks recorded in DESIGN.md. No instrumented field performance data
        exists — the site runs no analytics by design.

        '
      falsifier:
        condition: 'Recomputing the listed palette pairs under WCAG contrast rules finds any claimed AA
          pass absent, or the recorded QA does not include the stated rendering, mode, and interaction
          checks.

          '
        consequence: NARROW
      forbidden_rescues:
      - do not replace a failed palette pair with another color pairing or viewport and retain the original
        claim
      - do not treat visual preference or casual inspection as a substitute for WCAG computation or the
        listed QA checks
