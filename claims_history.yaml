  - claim_id: SITE-002
    digest: cf86b4ba9e146e000e246abe31420a0788b3f51afc029f490007cd9bfef7e4e4
    commitment:
      proposition: 'This site''s claim registry is enforced in CI: verify_claims.py validates schema and
        bindings, executes the executable review triggers against live evidence, and fails the build when
        any claim passes its freshness window — on every push and weekly.

        '
      scope: 'The verifier at the recorded content hash, and the public workflow that runs it. The generated-page
        and figure checks are separate steps in the same workflow (ledger, modules, observatory, figure
        geometry, internal links).

        '
      falsifier:
        condition: 'A controlled violation of a required registry field, bound-evidence trigger, or review
          window reaches a successful named CI workflow, or the workflow no longer runs on pushes to main
          and weekly.

          '
        consequence: REJECT
      forbidden_rescues:
      - do not cite a normal green run as evidence that violations are rejected
      - do not count a manual review or a generated-page drift check as automatic schema, trigger, or
        freshness enforcement
      - do not treat a warning-only or report-only job as a build failure
      non_claims:
      - a green run verifies registry consistency and quiet triggers, never the truth of any claim's content
      - an UNDETERMINED run (exit 2) blocks the build because a source was never reached; it is not a
        finding about any binding, and must not be read or recorded as a failed check
      - triggers watch file content; semantic drift outside watched files remains a manual review event,
        and the ledger says so
