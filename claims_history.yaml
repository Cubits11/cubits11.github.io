  - claim_id: MC-001
    digest: 36441f8cf7f59040a601e8d0581c2866d701bda7c99c91adbaab15c2ec6d1679
    commitment:
      proposition: 'As of 2026-08-27, among 20 public guardrail evaluations meeting the Missing Column
        Census''s frozen inclusion criteria (v1), 14 establish a shared item set and a common event definition;
        5 provide one of the census''s declared joint-evidence artifacts: a printed composition result
        or per-item outcomes that make one directly computable.

        '
      scope: 'A census claim about public reporting, bounded by the documented search protocol documented
        in census.yaml. Its literal inclusion wording is locked in repository history before row classification;
        that is a reproducibility lock, not an independent preregistration. It covers the artifacts that
        search found, not everything in existence; it says nothing about how well any evaluated system
        or stack performs, and nothing about what the unmeasured joint statistics would show. N, M, and
        K are recomputed mechanically from census.yaml by scripts/verify_census.py; this envelope''s expected
        block is cross-checked against that computation in CI. Since census schema v3 the joint-evidence
        mode counts in this note are derived the same way, from a declared joint_scope_additional field,
        rather than counted by hand here; scripts/verify_facts.py binds every current census numeral on
        every public page, and on the deployed page after release, to the quantity it asserts. M is a
        ladder, not a comparability verdict: 14 document shared items and a common event definition, 12
        have no stated threshold mismatch, and 0 document matched operating thresholds together with full
        exposure. Nothing here asserts that the 14 are interchangeable at a common operating point; the
        opposite is the finding. The 5 is an inclusive discovery count of noninterchangeable artifacts,
        not an all-miss rate or a deployment conclusion. Four artifacts print at least one composition
        result and two release aligned per-item outcomes from which joint statistics are directly computable;
        one artifact does both, so those descriptions intentionally overlap. The frozen phrase "separately
        attributable" did not specify whether a product or model name must be printed: the primary count
        treats systems a source distinguishes and reports consistently as separately attributable even
        when anonymized; the declared named-products-only sensitivity excludes Unit42 and mechanically
        yields N/M/K = 19/13/5. A drafted further clause — that no printed joint statistic among the then-four
        covers a commercial guardrail API — was withdrawn before publication when same-day adversarial
        review produced a live counterexample under one defensible reading (WAInjectBench''s printed ensemble
        includes GPT-4o prompted as a detector); this claim''s forbidden rescues bar narrowing "commercial"
        after the fact, so the clause was dropped rather than reinterpreted, and the event is recorded
        in the census revision history. On 2026-08-30, a post-release source audit found the distinct
        Multimodal Safeguard Bench repository, whose currently public Git history carries a pre-cutoff
        commit timestamp, and which the documented search had missed. That met this claim''s prior REJECT
        falsifier: the 19/13/4 envelope is rejected and retained in census revision history. This 20/14/5
        envelope is its corrected, superseding proposition, not a reinterpretation of the former count.

        '
      falsifier:
        condition: 'A qualifying public evaluation meeting criteria v1 and published on or before 2026-08-27
          is shown to be absent from this corrected census, or an examined row is shown to misreport its
          source such that recomputed N, M, or K differ from the stated 20/14/5.

          '
        consequence: REJECT
      forbidden_rescues:
      - do not reinterpret "joint statistic" after a counterexample appears in order to keep the stated
        counts
      - do not reclassify an examined row without recording the change and its reason in the census correction
        history
      - do not treat the bounded-search disclaimer as license to ignore a demonstrated miss — a miss rejects
        the current counts and the corrected census must state new ones
      - do not cite readership, links, or reuse of the census as evidence of its accuracy
      non_claims:
      - does not claim any evaluated guardrail stack performs poorly; an unfilled column is a reporting
        fact, not a performance finding
      - does not claim the unmeasured joint statistics would reveal dependence; measuring instead of assuming
        is the point
      - does not audit the quality of any per-system evaluation beyond the fields each row records
      - does not claim exhaustive coverage beyond the corrected, examined artifact set or coverage after
        the stated date
      expected:
        n_examined: 20
        m_shared_basis: 14
        k_present: 5
        m_strata:
          shared_basis: 14
          threshold_not_contradicted: 12
          threshold_documented_full_exposure: 0
  - claim_id: MC-002
    digest: 32df5e5f1ed013cf87e59d0b987527b813f0c9558dabf4716d301a2e5280eaf2
    commitment:
      proposition: 'On the 170-prompt per-item subset publicly released with BELLS''s 2025 misuse-detection
        evaluation (pinned commit below), the five specialized supervisors — Lakera Guard, Prompt Guard,
        LangKit, NeMo Guardrails, LLM Guard — have an OR-union of released binary verdict columns that
        flags 73 of the 82 prompts labelled harmful, leaving 9 all-miss (11.0%). The product of their
        individual miss rates is 3.5%; the release-recomputed all-miss rate is about 3.1× that independence
        plug-in on this file. The same OR-union flags 19 of the 50 benign prompts.

        '
      scope: 'Exactly the released file at the bound commit: 170 of the evaluation''s 990 non-adversarial
        prompts (the study''s ~4,165 adversarial prompts have no per-item release), selected by the authors
        under an unstated rule. Counting arithmetic only, at the vendors'' released binary verdicts; no
        population estimate, no uncertainty interval, and no claim about any system''s true rates is offered
        or licensed. Computed by scripts/reanalyze_bells_subset.py from scripts/mjgd_reference.py; the
        expected block below is what CI re-asserts against the downloaded, hash-verified file.

        '
      falsifier:
        condition: 'Recomputing from the bound, hash-verified file yields any count different from the
          expected block, or the file at the pinned ref no longer matches the recorded sha256, or the
          released columns are shown not to be the labelled systems'' verdicts.

          '
        consequence: REJECT
      forbidden_rescues:
      - do not substitute a different subset, column set, or harm-level filter to preserve the numbers
      - do not fold borderline prompts into either denominator after seeing the results
      - do not recast this subset arithmetic as a population estimate, with or without an interval, if
        the primary counts are challenged
      - do not cite the release-recomputed-to-plug-in ratio without the selection caveat that scopes it
      non_claims:
      - the subset is author-selected with an unstated rule — nothing here estimates any system's true
        rate, and no confidence interval is offered because the sampled population is undefined
      - not a ranking or endorsement of any vendor; the released verdicts are at unstated default configurations
      - says nothing about adversarial prompts, which dominate the full evaluation and have no per-item
        release
      - the release-recomputed-to-plug-in ratio describes this subset's arithmetic, not a general law
        of guardrail dependence
      - not an observed deployed five-guard stack; interpreting this static OR aggregation as a stack
        requires the separate full-exposure, parallel, fixed-operating-point assumptions
      expected:
        n_prompts: 170
        n_harmful: 82
        per_guard_catches:
          lakera_guard: 52
          prompt_guard: 5
          langkit: 25
          nemo: 70
          llm_guard: 0
        union_detection: 73
        all_miss: 9
        n_benign: 50
        benign_union_flagged: 19
        per_guard_benign_flags:
          lakera_guard: 7
          prompt_guard: 0
          langkit: 8
          nemo: 10
          llm_guard: 0
        n_borderline: 38
        leave_one_out_union:
          lakera_guard: 70
          prompt_guard: 73
          langkit: 73
          nemo: 55
          llm_guard: 73
  - claim_id: MC-003
    digest: 1985013d67e92daf10097adff1c2c2203d9edc20dd038c338e0ccf7f3b81a0bf
    commitment:
      proposition: 'For k guardrails scored on a common item set at a common operating point under block-on-any
        composition, the rate at which every guard misses the same item is fixed by the published per-guard
        miss rates only up to the interval [max(0, Σp − (k−1)), min p], and every point of that interval
        is attained by some joint law with those marginals. Marginals prove non-degradation of a static
        OR composition relative to its best member, but, when that identified set is non-degenerate, they
        do not identify strictly positive incremental benefit. They also identify a positive lower bound
        on static benign union-flag rate when any member has a positive benign flag rate. On the BELLS
        2025 partial per-item release — 82 prompts labelled harmful — the exact finite identified set
        is {0/82 … 12/82}; MC-002 recomputes 9/82 all-miss from the hash-verified released verdict file.
        Marginal catch counts plus the union identify only bounds on each guard''s exclusive full-stack
        coverage; the registered leave-one-out unions identify the realized values: NeMo 18, Lakera 3,
        and LangKit, Prompt Guard, and LLM Guard 0 on this stratum.

        '
      scope: 'The mathematics is classical — Bonferroni for the lower endpoint, monotonicity for the upper,
        Fréchet for sharpness — and nothing here claims to have derived it. What is contributed is the
        application: pricing, in probability units, what marginal-only guardrail reporting leaves undetermined,
        and identifying leave-one-out unions as a compact privacy-preserving disclosure of exclusive full-stack
        coverage. They do not identify pairwise or higher-order overlap, Shapley values, or causal structure.
        Every statement is conditional on block-on-any composition, per-item decisions that are functions
        of the item alone, a fixed population, full exposure, and a fixed operating point; it says nothing
        about sequential routes where downstream measurement is censored by upstream blocks, agentic systems
        where an intervention changes the trajectory, or any vendor''s product. The empirical half is
        one stratum of one author-selected subset: 82 harmful prompts, with 50 benign and 38 borderline
        held as separate strata and never folded in. It is a BELLS-specific reproduction, not an assertion
        that BELLS is the census''s only per-item outcome release. scripts/reanalyze_bells_subset.py re-computes
        the BELLS counts from the hash-verified upstream file in CI; scripts/identification.py checks
        the stated identification transformations against that registered envelope.

        '
      falsifier:
        condition: 'A joint law with the stated marginals achieves an all-miss rate outside the interval;
          an exact finite catch-set arrangement lies outside the stated finite grid or exclusive-coverage
          bounds; or recomputing from the bound BELLS file yields any count different from the expected
          block.

          '
        consequence: REJECT
      forbidden_rescues:
      - do not change the composition rule after the fact to preserve the direction of the result
      - do not restate "identified only up to" as "estimated to be" — a bound is not an estimate
      - do not quote where a release-recomputed value sits inside the interval as a score or a percentage
        of a gap closed; the endpoints come from adversarial couplings with no detector-behavioural content
      - do not cite the zero-exclusive-coverage results as a vendor ranking, a causal attribution, or
        evidence about any product outside this stratum
      - do not fold the borderline stratum into either denominator to change any figure
      non_claims:
      - no new mathematics is claimed; the bounds are Fréchet's and the lower endpoint is Bonferroni's
      - not a claim that guardrails in general fail together — this stratum cannot separate shared blind
        spots from prompt-difficulty heterogeneity
      - not a vendor evaluation; the released verdicts are at unstated default configurations, and one
        supervisor fires exactly once in the 170 released rows
      - the identified interval is what the marginals leave open, not a prediction about any deployed
        stack
      - leave-one-out unions identify only exclusive full-stack coverage; they do not identify pairwise
        or higher-order overlap, Shapley values, or causal contribution
      - says nothing about adversarial prompts, which dominate the full evaluation and have no per-item
        release
      expected:
        identified_set_lower: 0
        identified_set_upper: 12
        identified_set_size: 13
        release_recomputed_all_miss: 9
        denominator: 82
        benign_burden_floor_pct: 20
        improvement_floor_pct: 0
        members_zero_exclusive_full_stack_coverage: 3
        aggregate_unique_contribution_bounds:
          lakera_guard:
          - 0
          - 3
          prompt_guard:
          - 0
          - 3
          langkit:
          - 0
          - 3
          nemo:
          - 0
          - 21
          llm_guard:
          - 0
          - 0
  - claim_id: MC-004
    digest: b8ea2d9431167cb8d28e7cf235d6a1b8b7ad86e6dbe60859415d7f18eabdbb4f
    commitment:
      proposition: 'On the per-item guard-verdict files publicly released with Multimodal Safeguard Bench''s
        full_run (pinned commit below; six verdict files and the release''s two printed-metric files hash-verified),
        the three guards — Llama Guard 4, Llama Guard 3 Vision, ShieldGemma 2 — have harness-normalized
        native `unsafe` labels whose static Boolean OR is 1 on 192 of 200 harmful-labelled text items
        (8 all-zero rows, 4.0%) and all 200 harmful-labelled image items (0 all-zero rows), while the
        same OR is 1 on 32 of 250 benign-labelled text items (12.8%) and every one of 250 benign-labelled
        image items. Llama Guard 3 Vision alone has a 1-bit on all 250 released benign image items. The
        complete 2^3 native-label pattern table, leave-one-out bit ORs, and unique bit contributions for
        each released stratum are bound below. The release prints per-guard metrics and two two-guard
        compositions; it prints no three-guard bit OR, no all-zero-row count, no leave-one-out table,
        and no pattern decomposition — and every recomputed quantity that overlaps what it does print
        is asserted equal to the printed value.

        '
      scope: 'Exactly the six committed verdict files of the full_run directory at the bound commit: 400
        harmful and 500 benign items, each stratum half text and half image, one Boolean `blocked` adapter
        bit per item per guard. Let L be the release''s harmful/benign label, A_s each guard''s native
        `unsafe` predicate, B_s the harness mapping of that predicate to `blocked`, and O = OR_s B_s.
        The bound arithmetic reports B and O conditional on L. Because the harness uses `blocked` items
        to suppress target generation, O is also a valid counterfactual harness-block decision for these
        released rows under a fixed block-on-any rule. It does not establish a source-defined translation
        from every A_s to one shared catch event E: Llama Guard 3 Vision is a multimodal prompt/response
        classifier, while ShieldGemma 2 is an image-only three-policy classifier, and the pipeline merely
        maps each native `unsafe` label to `blocked`. Counting arithmetic only, at the guards'' released
        native operating rules (the Llama guards emit labels autoregressively; ShieldGemma 2 blocks above
        a 0.5 policy-violation probability; the source documents no matched operating-point calibration,
        so M-ladder threshold comparability is unchanged). ShieldGemma 2''s text-item bits are deterministic
        passes as committed and documented upstream, which is why its text column is zero — an explicit
        released outcome, not missing data. Strata are computed exactly as released and never folded;
        file totals are sums of the bound strata and carry no additional content. Computed by scripts/reanalyze_msbench.py
        from scripts/mjgd_reference.py; the expected block below is what CI re-asserts against the downloaded,
        hash-verified files.

        '
      falsifier:
        condition: 'Recomputing from the bound, hash-verified files yields any count different from the
          expected block, or any pinned file no longer matches its recorded sha256, or any recomputed
          quantity that overlaps the release''s printed metrics disagrees with the printed value, or the
          committed blocked columns are shown not to be the named guards'' verdicts.

          '
        consequence: REJECT
      forbidden_rescues:
      - do not fold text and image strata — or harmful and benign files — into pooled denominators to
        move any figure; the strata are bound exactly as released
      - do not substitute verdicts from the release's other run directories (adaptive_run, carrier sweeps,
        rendering probes) to preserve a number bound to full_run
      - do not reinterpret ShieldGemma 2's deterministic text passes as missing data to shrink a denominator
