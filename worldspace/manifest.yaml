# ------------------------------------------------------------------ routes
routes:
  primary: /try/#try-a
  claim: /ledger/#CC-001
  witnesses: /ledger/#CC-004
  code: https://github.com/Cubits11/cubits11.github.io/tree/main/worldspace
  experiment_b: /try/#try-b
  disagree_template: reproduction.yml
  disagree_prefill:
    experiment: TRY-A
    claim: CC-001
    command: python3 scripts/try_same_scores.py
    title: "Reproduction: TRY-A — mismatch"
    outcome: "Mismatch — a FAIL line, a different count, or a nonzero exit"

# ------------------------------------------------------ epistemic contract
falsifier: >-
  A clean-clone execution of the bound kernel on marginals (0.10, 0.10)
  returns AND bounds other than [0.00, 0.10], or a witness that fails
  nonnegativity, the unit sum, either marginal, or endpoint attainment at
  tolerance 1e-9 (CC-001 / CC-004, consequence REJECT); or any reachable state
  of the instrument shows a readout other than 10 / 100 for either guard, a
  BOTH MISS value outside 0 … 10, a specimen whose scores are not 10 / 10, or
  a world whose atoms disagree with the registered witness form — each checked
  by scripts/verify_worldspace.py against the generated page and the QA receipt.

non_claims:
  - nothing here measures a real guardrail; the population, the discs and the rings are a construction, and the two scores are declared inputs
  - real stacks with other scores have other intervals; this page says nothing about the joint failure rate of any deployed pair
  - independence is not shown to be false; it is an assumption-world, named — the scores alone can neither confirm nor refute it
  - a bound is not an estimate and no point inside the interval is selected; the interval is what the two scores leave open, not a prediction
  - the count of arrangements is combinatorics on this constructed population, not a prevalence, a probability, or a claim about any evaluation
  - this is not a safety assessment of any system, and the animation adds no evidence beyond what the registry binds — the script the page routes to prints the same interval

adversarial_misreadings:
  A_joint_is_one_percent: the amber point is labelled INDEPENDENCE and described as what one assumption selects; the switch shows the selection being made and released; the exit boundary repeats it
  B_real_guardrails_range: CONSTRUCTED EXAMPLE stands in the status strip and the ledger tag of every state; the boundary names real stacks as out of scope
  C_independence_is_false: the switch language is select/release, never wrong; the boundary states the scores cannot refute it
  D_measured_outcomes: the population is tagged ILLUSTRATIVE and the field CONSTRUCTED, a sample; no vendor, benchmark or product is named on the page
  E_animation_proves_more_than_code: the closing action is the script that prints the same interval; the verifier asserts the page's worlds against the registry; the receipt records what was rendered
  F_all_assumptions_bad: the boundary says the criticism is a silent assumption, not assumption itself; the amber world is drawn with the same care as every other

# ------------------------------------------------------------- verification
critical_states:
  - {id: predict, viewports: [desktop, phone], reduced_motion: [false, true]}
  - {id: touch-0, viewports: [desktop, phone], reduced_motion: [false, true]}
  - {id: touch-5, viewports: [desktop, phone], reduced_motion: [false]}
  - {id: touch-10, viewports: [desktop, phone], reduced_motion: [false, true]}
  - {id: field, viewports: [desktop, phone, tablet, phone-large, desktop-large], reduced_motion: [false, true]}
  - {id: assume, viewports: [desktop, phone], reduced_motion: [false, true]}
  - {id: exit, viewports: [desktop, phone], reduced_motion: [false]}
viewports:
  desktop: [1440, 900]
  desktop-large: [1920, 1080]
  tablet: [780, 844]
  phone-large: [430, 932]
  phone: [390, 844]

performance_budget:
  html_bytes_max: 70000
  js_bytes_max: 34000
  new_font_files: 0
  images_fetched_on_load: 0
  third_party_requests: 0
  first_render_ms_max_local: 800

# ---------------------------------------------------------- cold-test protocol
# FROZEN before any viewer answers. Responses are recorded verbatim in
# distribution/outcomes.yaml → diagnostics.cold_comprehension_trials with
# film: worldspace. Scoring rules are not rewritten after responses.
cold_test:
  viewers_min: 5
  viewers_max: 8
  conditions: sound off, no prior explanation, the visitor alone with the page, the observer silent until the questions
  questions:
    - id: prediction
      when: before interaction
      text: "If A misses 10/100 and B misses 10/100, how many do you think both miss?"
      scoring: recorded verbatim; never scored
    - id: fixed_changed
      when: after the core interaction
      text: "What stayed fixed, and what changed?"
      scoring: PASS only if both (a) the two per-guard scores/marginals are named as fixed and (b) the joint count/overlap is named as changing
    - id: real_guardrails
      when: after the field
      text: "Does this show the observed joint failure rate of two real guardrails?"
      scoring: PASS only if the answer is no (constructed, illustrative, an example, not real data); any yes, or 'real guardrails', is FAIL
    - id: one_percent
      when: after the amber point
      text: "What does the 1% point mean?"
      scoring: PASS only if the answer ties 1% to independence, an assumption, or multiplying the scores; 'the true rate', 'the answer', 'what they miss' is FAIL
    - id: agency
      when: after the exit
      text: "What would you check next if you did not trust this?"
      scoring: recorded verbatim; PASS only if the answer names running the script, reading the claim, or an independent check; never used to gate publication
  publish_rule: >-
    HOLD if 2 or more viewers FAIL the same scored question; a HOLD triggers
    one revision and a fresh cold set, never a rescore. Cold comprehension is
    diagnostic, not qualified external reproduction.
  what_counts_against_the_experiment:
    - repeated confusion about constructed vs empirical
    - failure to name what stayed fixed
    - reading independence as the true answer
    - the interaction obscuring rather than clarifying the proof
    - a static poster outperforming the interactive instrument on the same questions
    - the phone interaction failing
