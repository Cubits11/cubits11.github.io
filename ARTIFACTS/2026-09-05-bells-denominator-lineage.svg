<text class="tag evidence" x="48" y="678">● HASH-VERIFIED FILE</text>
<text class="rowname" x="48" y="695">Playground subset · non_adversarial_prompts.csv @ b20aeed5 = 507566c5 (head) · 2025-03-22</text>
