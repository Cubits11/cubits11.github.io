<path class="seg-borderline" d="M846.0,388 H1242.7 a4,4 0 0 1 4,4 V406 a4,4 0 0 1 -4,4 H846.0 Z"><title>borderline 360 of 1077 — sha256 a8d2e4ea69b3…</title></path>
<text class="count in-light" x="852.0" y="403">360</text>
<text class="total" x="1256.7" y="403">= 1,077</text>
</g>
<g class="row" data-state="derived">
<rect class="rule review" x="34" y="448" width="3" height="84"/>
<text class="tag review" x="48" y="458">◐ DERIVED</text>
<text class="rowname" x="48" y="475">Leaderboard aggregate population · safeguard_evaluation_results.csv @ dde32a3d → 507566c5</text>
<text class="rowsub" x="48" y="490">= pool d6ebd0e5 minus its 36 Miscellaneous rows (30 harmful · 6 benign). Numerators match 9/9 for Lakera, NeMo, LLM Guard; untestable for Prompt Guard</text>
<text class="rowsub" x="48" y="504">and LangKit.</text>
<rect class="seg-harmful" x="48.0" y="512" width="363.1" height="22"><title>harmful 328 of 1041 — denominators inferred from the aggregate’s fractions; sha256 6935166c5663…</title></rect>
<text class="count in-dark" x="54.0" y="527">328</text>
<rect class="seg-benign" x="413.1" y="512" width="390.9" height="22"><title>benign 353 of 1041 — denominators inferred from the aggregate’s fractions; sha256 6935166c5663…</title></rect>
<text class="count in-dark" x="419.1" y="527">353</text>
<path class="seg-borderline" d="M805.9,512 H1202.6 a4,4 0 0 1 4,4 V530 a4,4 0 0 1 -4,4 H805.9 Z"><title>borderline 360 of 1041 — denominators inferred from the aggregate’s fractions; sha256 6935166c5663…</title></path>
<text class="count in-light" x="811.9" y="527">360</text>
<text class="total" x="1216.6" y="527">= 1,041</text>
</g>
<g class="row" data-state="file">
<rect class="rule evidence" x="34" y="558" width="3" height="84"/>
<text class="tag evidence" x="48" y="568">● HASH-VERIFIED FILE</text>
<text class="rowname" x="48" y="585">Playground subset · non_adversarial_prompts.csv @ 077555d9 · 2025-02-19</text>
<text class="rowsub" x="48" y="600">Commit subject “smaller dataset for playground”. SELECTION RULE: UNKNOWN. Superseded.</text>
