<text class="foot" x="48" y="792">Source: python3 scripts/bells_denominators.py --json (CentreSecuriteIA/bells_leaderboard, pinned by commit and sha256). Packet: ARTIFACTS/2026-09-05-FABLE-5.1-OBS-CUT.md.</text>
