        also include downstream target-model and judge behavior, so they are
        not relabeled as an all-guard-miss statistic.
    residual_coverage_reported:
      value: "yes"
      evidence: >
        The paper states that SG2 rescues 30 of the 36 image items LG4
        misses (83%): an explicit pairwise residual-coverage result; no
        full three-guard decomposition is printed.
    sequential_gating_modeled:
      value: "no"
      evidence: >
        The reported combinations are OR rules and modality routing built
        from guard verdicts. Models are staged sequentially only to fit one
        GPU, not as a measured sequential deployment gate.
    uncertainty_reported:
      value: "yes"
      evidence: >
        The paper and results/full_run/ensemble.json report Wilson 95%
