  - id: multimodal-safeguard-bench-2026
    status: examined
    title: "Multimodal Safeguard Bench: Guard Blind Spots Are Architecture-Specific and Complementary"
    authors_or_org: "Patrick Kollman — Independent Researcher"
    publication_date: "2026-07-13"
    primary_url: "https://github.com/PatrickKollman/Multimodal-Safeguard-Bench/tree/fb6f32e6b50b6faad833b815ebcd80afd2068bff"
    task: "multimodal guard-layer harmful-request detection and end-to-end jailbreak prevention, with benign over-refusal"
    dataset_population: >
      200 HarmBench harmful behaviors and 250 XSTest safe prompts; every
      intent is evaluated as a text item and as an image-rendered item, for
      400 harmful plus 500 benign items.
    n_items: "900 (400 harmful + 500 benign)"
    n_systems: 3
    systems: ["Llama-Guard-4-12B", "Llama-Guard-3-11B-Vision", "ShieldGemma-2-4B"]
    same_items_for_all_systems:
      value: "yes"
      evidence: >
        The canonical release contains matching item_id sets in every one
        of the three harmful JSONLs (400 items each) and three benign JSONLs
        (500 items each); the paper describes the same 200 + 250 intents
        rendered in both modalities.
    same_event_definition:
      value: "yes"
      evidence: >
        Every guard-result JSONL records the same Boolean `blocked` event
        against common harmful/benign item labels; the paper defines
        per-modality detection recall and over-refusal from those verdicts.
    thresholds_comparable:
      value: "no"
      evidence: >
        Llama Guard 4 and Llama Guard 3 Vision treat an autoregressively
        generated unsafe label as a block, while ShieldGemma-2 blocks when a
        per-policy violation probability exceeds 0.5. The source documents
        no matched operating-point calibration.
    all_systems_saw_all_items:
      value: "yes"
      evidence: >
        Each named guard has one committed verdict for each of the same 900
        item_ids. ShieldGemma-2 returns a deterministic safe verdict for
        text-only items without a model call; that is an explicit pass
        outcome, not missing data or gating.
    per_system_metrics: >
      detection recall by modality, end-to-end ASR by modality, aggregate
      over-refusal, and protection gap; the main table and ensemble JSON
      report Wilson 95% intervals where applicable.
    item_level_outcomes_released:
      value: "yes"
      evidence: >
        results/full_run/guard_*_{harmful,benign}.jsonl commits per-item
        item_id, guard_name, and Boolean blocked verdicts for all three
        guards and all 900 items (not model generations).
    pairwise_intersections_reported:
      value: "yes"
      evidence: >
        The paper's Ensembles section reports that SG2 rescues 30 of the 36
        harmful image items LG4 misses and loses none: a pairwise
        residual/intersection result for that pair and modality, not a full
        pairwise matrix.
    union_detection_reported:
      value: "yes"
      evidence: >
        The Ensemble operating-points table and results/full_run/ensemble.json
        print OR-composition detection rows for LG4⊕SG2 and LG4⊕LG3V.
    all_miss_rate_reported:
      value: "no"
      evidence: >
