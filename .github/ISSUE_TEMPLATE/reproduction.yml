name: Reproduction run — match or mismatch
description: >-
  File the result of running an experiment from /try/ or a registered
  reproduction script. Both outcomes are wanted: a match becomes the
  claim's independent-reproduction record; a mismatch is handled as a
  correction under the same-day correction policy and is credited beside
  the claim it corrects.
title: "Reproduction: <experiment or claim id> — <match|mismatch>"
labels: ["reproduction"]
body:
  - type: markdown
    attributes:
      value: >-
        You do not need to know this repository's vocabulary. Paste what
        you ran and what it printed. A different result is the most useful
        thing you can send.
  - type: input
    id: experiment
    attributes:
      label: Experiment id
      description: From /try/ — TRY-A (60-second proof), TRY-B (3-minute reconstruction), TRY-C (15-minute audit) — or leave blank if you ran a script directly.
      placeholder: TRY-B
    validations:
      required: false
  - type: input
    id: claim
    attributes:
      label: Claim id
      description: The registered claim the experiment names (see /ledger/), e.g. CC-001, MC-002, MC-004.
      placeholder: MC-002
    validations:
      required: true
  - type: dropdown
    id: evidence_class
    attributes:
      label: Evidence class
      description: >-
        Use static-reconstruction for a recomputation from released static
        outputs (every /try/ experiment). Choose direct-route only for an
        item-level trace from a route that was actually executed.
      options:
        - static-reconstruction
        - direct-route
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Repository commit
      description: Output of `git rev-parse HEAD` in your clone.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version (e.g. `uname -sr; python3 --version`).
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command you ran
      placeholder: python3 scripts/reanalyze_bells_subset.py
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - "Match — exit 0, final line matched the page's expected output"
        - "Mismatch — a FAIL line, a different count, or a nonzero exit"
    validations:
      required: true
  - type: textarea
    id: stdout
    attributes:
      label: Full stdout (and stderr if any)
      description: Paste the complete output. For a mismatch, this is the evidence the correction starts from.
      render: text
    validations:
      required: true
  - type: dropdown
    id: credit
    attributes:
      label: Credit permission
      description: Matching runs are recorded as the claim's reproduction record; mismatches are credited in the correction history. Either way the ledger entry names you only if you say so here.
      options:
        - "Yes — credit me by the name on this GitHub account"
        - "No — record the run without naming me"
    validations:
      required: true
