name: verify

on:
  push:
    branches: [main]
  # Every proposed change is gated, not only what already landed. The
  # campaign's own standard — publish the stack, not the flattering column —
  # applies to its CI: a branch that has never run these checks is not
  # reviewable, and "it passed on main" says nothing about the PR.
  pull_request:
  schedule:
    # Weekly standing gate: freshness windows and executable review triggers
    # both run here — a claim past its window, or whose bound evidence has
    # changed upstream, fails this run. That failure IS the review trigger
    # firing; the fix is a re-review (or withdrawal), never silence.
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  claims:
    name: Claim registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: sitemap lastmod values are asserted against git
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Verify registry (shape, bindings, triggers, freshness, liveness)
        run: python scripts/verify_claims.py
      - name: Verify census (frozen criteria, row shape, mechanical counts)
        run: python scripts/verify_census.py
      - name: Ledger is generated, not hand-edited (drift check)
        run: python scripts/generate_ledger.py --check
      - name: Figures cannot lie (geometry assertions)
        run: python scripts/verify_figures.py
      - name: Modules are generated, not hand-edited (drift + schema check)
        run: python scripts/generate_modules.py --check
      - name: Observatory is generated, not hand-edited (drift check)
        run: python scripts/generate_observatory.py --check
      - name: Missing Column pages are generated, not hand-edited (drift check)
        run: python scripts/generate_missing_column.py --check
      - name: Sitemap matches pages, lastmod matches history (drift check)
        run: python scripts/generate_sitemap.py --check
      - name: Disclosure arithmetic holds its identities
        run: python scripts/mjgd_reference.py --test
      - name: Identification bounds are sharp, attained, and match MC-003
        run: python scripts/identification.py
      - name: MC-002 reproduces from the bound public release
        run: python scripts/reanalyze_bells_subset.py
      - name: Internal links resolve (pages, anchors, fragments)
        run: python scripts/check_links.py
      - name: Frontend structural and local-only preflight gates
        run: python scripts/verify_frontend.py

  reproduce:
    name: Reproduce bound artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The self-clone replay verifies ancestry from the corrective
          # baseline as well as the exact candidate revision.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Clean-clone the bound commit and re-run the kernel
        run: python scripts/reproduce_cc001.py
      - name: Clean-clone this site revision and replay deterministic gates
        run: python scripts/verify_clean_clone.py --commit "$GITHUB_SHA"

  deploy:
    # This is the only deployment path once Pages is configured to use GitHub
    # Actions. Branch-based Pages publishing cannot be gated: it can publish a
    # bad commit before an independent workflow finishes. The Pages source
    # change is an explicit repository-admin action recorded in README.md.
    name: Deploy verified GitHub Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [claims, reproduce]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified static artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4

  deployed:
    # Post-deploy gate. A checkout proves only repository coherence. This
    # job waits for Pages to serve a coherent target: every sitemap route,
    # the exact census bytes checked here, a rendered census checksum, and
    # the canonical correction policy. It never treats the prior deploy as
    # evidence for this revision.
    name: Deployed site smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.claims.result == 'success' && needs.reproduce.result == 'success' &&
      (github.event_name != 'push' || needs.deploy.result == 'success')
    needs: [claims, reproduce, deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Wait for every route, census checksum, counts, and corrections policy
        run: python scripts/smoke_deployed.py --attempts 30 --interval-seconds 10

  lighthouse:
    # Observation, not a gate: collects Lighthouse lab reports for the live
    # site as run artifacts. On push this measures the previously deployed
    # revision (Pages deploys asynchronously); the weekly run measures the
    # settled site. No score assertions — DESIGN.md explains why numbers are
    # only claimed once they are measured.
    name: Lighthouse (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://cubits11.github.io/
            https://cubits11.github.io/essays/when-marginals-are-not-enough/
          uploadArtifacts: true
