name: verify

on:
  push:
    branches: [main]
  schedule:
    # Weekly freshness gate: a claim past its review window fails this run,
    # which is the review trigger firing — see scripts/verify_claims.py.
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  claims:
    name: Claim registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/verify_claims.py

  lighthouse:
    # Observation, not a gate: collects Lighthouse lab reports for the live
    # site as run artifacts. On push this measures the previously deployed
    # revision (Pages deploys asynchronously); the weekly run measures the
    # settled site. No score assertions — DESIGN.md explains why numbers are
    # only claimed once they are measured.
    name: Lighthouse (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://cubits11.github.io/
            https://cubits11.github.io/essays/when-marginals-are-not-enough/
          uploadArtifacts: true
