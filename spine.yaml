# Artifacts named as renderings that, on inspection, assert nothing the gate
# can bind. Listed so the exclusion is visible and its reason is on record;
# the receipt is still loaded, so the exclusion cannot rot silently.
not_renderings:
  - id: room-11-FrechetAtomGarden
    named_for: [MC-003]
    named_by: "docs/foundations/FABLE-BRIEF.md §B, row 'room'"
    source:
      kind: world_labels
      path: films/lib/blender/world-labels.receipt.json
      prefix: FrechetAtomGarden_
    finding: >-
      probed 2026-09-05 with films/lib/blender/probe_world_labels.py, read-only:
      the garden's labels are its title, the line "finite atoms witness
      endpoint bounds", eight atom indices 0–7, and two witness panels
      reading "endpoint: lower / upper, feasible: True". It speaks no
      numeral of MC-003 and carries no non-claim, so a change to the
      identified set cannot make it fail — it asserts nothing about the
      identified set. Eight atoms are the 2^3 outcomes of three binary
      guards, the structure of CC-003/CC-004, not the {0…12}/82 set.
      Excluded from the gate rather than bound to a claim it does not
      render; docs/foundations/devices.yaml:room_atom_map binds it to atoms
      A2/A6/A7 only, and says that is a proposed carrying capacity, not an
      audited outcome.
