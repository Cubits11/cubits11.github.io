      - says: "recomputes {release_recomputed_all_miss}/{denominator} all-miss"
      - says: "NeMo {MC-002.exclusive.nemo}, Lakera {MC-002.exclusive.lakera_guard}, and LangKit, Prompt Guard, and LLM Guard {MC-002.exclusive.llm_guard}"
    strongest: "the exact finite identified set is {0/82 … 12/82}"

  - id: ledger-MC-003
    surface: page
    claims: [MC-003]
    sources:
      - kind: html
        path: ledger/index.html
        region_start: '<article class="claim" id="MC-003">'
        region_end: '</article>'
    speaks:
      - says: "{denominator} prompts labelled harmful"
      - says: "{{{identified_set_lower}/{denominator} … {identified_set_upper}/{denominator}}}"
      - says: "recomputes {release_recomputed_all_miss}/{denominator} all-miss"
      - says: "NeMo {MC-002.exclusive.nemo}, Lakera {MC-002.exclusive.lakera_guard}, and LangKit, Prompt Guard, and LLM Guard {MC-002.exclusive.llm_guard}"
    strongest: "the exact finite identified set is {0/82 … 12/82}"

  - id: explore-thirteen-worlds
    surface: page
    claims: [MC-003]
    sources:
      - kind: html
        path: explore/index.html
        # the screening-room card; the region stops where the card's
