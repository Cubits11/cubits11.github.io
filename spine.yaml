        path: films/thirteen-worlds/film.html
        # the film's own on-screen strings; numerals in the drawing code are
        # geometry, so this source is bound by phrasing and not swept
        sweep: false
    speaks:
      - says: "{identified_set_size} Worlds, One File"
      - says: "The {MC-002.k_guards} published miss rates"
      - says: "{{{identified_set_lower} … {identified_set_upper}}} of {denominator} — {identified_set_size} worlds"
      - says: "fixes it at {MC-002.all_miss};"
      - says: "({MC-002.independence_pct_2dp}%, equivalent to {MC-002.independence_prompts_2dp} prompts"
      - says: "On the {denominator} prompts labelled harmful"
      - says: "the {MC-002.k_guards} per-guard miss counts ({MC-002.miss.nemo}, {MC-002.miss.lakera_guard}, {MC-002.miss.langkit}, {MC-002.miss.prompt_guard}, {MC-002.miss.llm_guard})"
      - says: "{{{identified_set_lower}/{denominator} … {identified_set_upper}/{denominator}}}"
      - says: "flags {MC-002.union_detection}, so the all-miss count is {MC-002.all_miss} ({MC-002.all_miss_pct_1dp}%)"
      - says: "plug-in is {MC-002.independence_pct_2dp}%, or {MC-002.independence_prompts_2dp} prompts, and the recomputed rate is {MC-002.ratio_2dp}× that plug-in"
      - says: "{denominator} − registered catches"
      - says: "satisfies the {MC-002.k_guards} counts"
      - says: "all-miss reads {identified_set_upper}/{denominator}"
      - says: "identified set {{{identified_set_lower}…{identified_set_upper}}} drawn on the axis"
      - says: "identified set {{{identified_set_lower}…{identified_set_upper}}} on the axis"
      - says: "union bar {MC-002.union_detection}/{denominator} pins the all-miss count at {MC-002.all_miss}/{denominator}"
      - says: "marker at {MC-002.independence_prompts_2dp} prompts"
      # film.html only
      - says: "where these {identified_set_upper} sit is not in the published rates"
      - says: "the union ({MC-002.union_detection}/{denominator}) pins the all-miss count at {MC-002.all_miss}/{denominator}"
      - says: "plug-in ({MC-002.independence_prompts_2dp} prompts)"
      - says: "[0, 4, 8, {identified_set_upper}].forEach"
    strongest: "The five published miss rates of the BELLS supervisors pin the all-miss count only to {0 … 12} of 82 — thirteen worlds"

  - id: D-006
    surface: device
    claims: [MC-003]
    sources:
      - kind: yaml
        path: docs/foundations/devices.yaml
        select: devices[id=D-006]
        fields: [name, priority, materials, action, state_space, feasible_set, "readout.*", doorway_note]
        sweep: true
    speaks:
      - says: "MC-003's {{{identified_set_lower}/{denominator} ... {identified_set_upper}/{denominator}}} is a cell narrowed to {identified_set_size} legal values, with {release_recomputed_all_miss} inside it"
    unbound_ok:
      - says: "exactly 3 legal values"
        why: the Latin-square fragment's own cell; device geometry, not a quantity of the claim
      - says: "a three-value answer"
        why: the same device geometry, spelled out
    strongest: "MC-003's {0/82 ... 12/82} is a cell narrowed to thirteen legal values, with 9 inside it"

  - id: observatory-MC-003
    surface: page
    claims: [MC-003]
    sources:
      - kind: html
        path: observatory/index.html
        region_start: '<h2 class="mono cap-id">MC-003</h2>'
        region_end: '<h2 class="mono cap-id">'
    speaks:
