# The spine — one claim, N renderings, one gate.  Enforced by scripts/verify_spine.py.
#
# A claim exists here at several bandwidths: its registry record, a film, a
# device record, a page. Each surface has its own gate and none knows the
# others exist. This file names, for every rendering, the claims it asserts,
# where its text lives, the numerals it speaks, and the strongest sentence it
# says out loud — so that a change to one number in claims.yaml fails every
# surface that still says the old one.
#
# The spine carries no second copy of any value. A phrasing is written with
# `{key}` placeholders (`{{` and `}}` are literal braces); the value is read
# from the rendering and compared with the key in the claim's `expected`
# block, or with a derivation shown under `derived:` below. Unprefixed keys
# resolve against the rendering's first claim; `MC-002.union_detection`
# resolves against that claim. MC-001's quantities are the census arithmetic
# (scripts/facts.registry), not a hand-typed block.
#
# Rules (see the script's docstring): S1 numeral agreement, with an unbound
# numeral failing on hand-authored prose (`sweep: true`); S2 no rendering
# speaks a scope-widening token its claim's own text never uses
# affirmatively; S3 non-claims travel verbatim in the artifact; S4 coverage
# is printed and never optimised. A green spine says the renderings agree
# with each other. It says nothing about whether any claim is true.

version: "0.1"
written: "2026-09-05"

lexicon:
  # S2. Tokens that widen the scope of a sentence beyond a counted file, a
  # named composition rule and a stated stratum. Matched as whole words,
  # case-insensitive, after the proper nouns below are blanked, in sentences
  # that carry no negation cue. Adding a token here is cheap; a token is
  # removed only with a reason written into the commit that removes it.
  scope_wideners:
    - guardrails
    - guardrail
    - classifiers
    - safety classifiers
    - detectors
    - filters
    - in general
    - generally
    - always
    - universal
    - universally
    - typically
    - in practice
    - real-world
    - real world
    - deployed
    - deployment
    - production
    - stacks
    - any stack
    - every stack
    - all stacks
    - vendors
    - any vendor
    - every vendor
    - all vendors
    - products
    - models
    - LLMs
    - language models
    - AI systems
    - proves
    - proof
    - law
    - everyone
    - everywhere
    - most
    - majority
    - industry
    - standard practice
    - state of the art
  # A sentence containing one of these is read as a limit, not an assertion.
  # Crude: it will exempt some affirmative sentences that happen to contain
  # "no". The failure it targets is affirmative inflation, and that is what
  # it catches.
  negation_cues:
    - not
    - "no"
    - never
    - nothing
    - neither
    - nor
    - without
    - cannot
    - can't
    - unstated
    - non-claim
    - non-claims
  # Product names containing a lexicon token. Blanked before S2 runs.
  proper_nouns:
    - NeMo Guardrails
    - Lakera Guard
    - Prompt Guard
    - LLM Guard
    - LangKit
    - Multimodal Safeguard Bench

# Arithmetic on registry keys, shown here so that a rendering may speak a
# derived number (a miss count, a percentage, a ratio) and still be bound.
# Only round/min/max/abs/len and + - * / ** are evaluated.
derived:
  MC-002.k_guards: "len(MC-002.per_guard_catches)"
  MC-002.k_guards_minus_one: "len(MC-002.per_guard_catches) - 1"
  MC-002.miss.lakera_guard: "MC-002.n_harmful - MC-002.per_guard_catches.lakera_guard"
  MC-002.miss.prompt_guard: "MC-002.n_harmful - MC-002.per_guard_catches.prompt_guard"
  MC-002.miss.langkit: "MC-002.n_harmful - MC-002.per_guard_catches.langkit"
  MC-002.miss.nemo: "MC-002.n_harmful - MC-002.per_guard_catches.nemo"
  MC-002.miss.llm_guard: "MC-002.n_harmful - MC-002.per_guard_catches.llm_guard"
  MC-002.all_miss_pct_1dp: "round(100 * MC-002.all_miss / MC-002.n_harmful, 1)"
  MC-002.independence_rate: >-
    (MC-002.miss.lakera_guard * MC-002.miss.prompt_guard * MC-002.miss.langkit
     * MC-002.miss.nemo * MC-002.miss.llm_guard) / MC-002.n_harmful ** 5
  MC-002.independence_pct_1dp: "round(100 * MC-002.independence_rate, 1)"
  MC-002.independence_pct_2dp: "round(100 * MC-002.independence_rate, 2)"
  MC-002.independence_prompts_2dp: "round(MC-002.n_harmful * MC-002.independence_rate, 2)"
  MC-002.ratio_1dp: "round((MC-002.all_miss / MC-002.n_harmful) / MC-002.independence_rate, 1)"
  MC-002.ratio_2dp: "round((MC-002.all_miss / MC-002.n_harmful) / MC-002.independence_rate, 2)"
  MC-002.exclusive.lakera_guard: "MC-002.union_detection - MC-002.leave_one_out_union.lakera_guard"
  MC-002.exclusive.prompt_guard: "MC-002.union_detection - MC-002.leave_one_out_union.prompt_guard"
  MC-002.exclusive.langkit: "MC-002.union_detection - MC-002.leave_one_out_union.langkit"
  MC-002.exclusive.nemo: "MC-002.union_detection - MC-002.leave_one_out_union.nemo"
  MC-002.exclusive.llm_guard: "MC-002.union_detection - MC-002.leave_one_out_union.llm_guard"
  CC-001.k: "len(CC-001.marginals)"
  CC-001.independence_and: "CC-001.marginals.0 * CC-001.marginals.1"
  CC-001.marginal_pct.0: "round(100 * CC-001.marginals.0)"
  CC-001.marginal_pct.1: "round(100 * CC-001.marginals.1)"
  CC-001.and_lower_pct: "round(100 * CC-001.bounds.and.0)"
  CC-001.and_upper_pct: "round(100 * CC-001.bounds.and.1)"
  CC-001.independence_pct: "round(100 * CC-001.marginals.0 * CC-001.marginals.1)"

renderings:
  # ---------------------------------------------------------------- MC-003
  - id: MC-003
    surface: registry
    claims: [MC-003]
    sources:
      - kind: claim_fields
        fields: [proposition, scope]
        sweep: true
    speaks:
      - says: "{denominator} prompts labelled harmful"
      - says: "{{{identified_set_lower}/{denominator} … {identified_set_upper}/{denominator}}}"
      - says: "recomputes {release_recomputed_all_miss}/{denominator} all-miss"
      - says: "NeMo {MC-002.exclusive.nemo}, Lakera {MC-002.exclusive.lakera_guard}, and LangKit, Prompt Guard, and LLM Guard {MC-002.exclusive.llm_guard}"
      - says: "{denominator} harmful prompts, with {MC-002.n_benign} benign and {MC-002.n_borderline} borderline"
    unbound_ok:
      - says: "max(0, Σp − (k−1))"
        why: the Fréchet lower endpoint written as a formula; its constants are not quantities of the claim
    strongest: "the exact finite identified set is {0/82 … 12/82}"

