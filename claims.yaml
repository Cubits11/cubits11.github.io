  - id: CC-003
    proposition: >
      CC-Framework's E1 dependence-evidence study established constructively
      that distributions with identical singleton failure rates (0.5) and
      identical pairwise overlaps (0.25) can differ in three-way failure
      probability — 0 under even parity, 0.25 under odd parity — so
      measuring every pair does not identify a three-guardrail stack. E1 is
      synthetic; its recorded decision is Narrow.
    scope: >
      The frozen study document at the bound commit. Controlled synthetic
      generators only; no real guardrail was measured.
    dimensions:
      visibility: public
      provenance: owner_authored
      support_role: document
      evidential_status: supported_within_scope
      maturity: released
    support:
      url: "https://github.com/Cubits11/cc-framework/blob/ee61a710243c74ec49d5896167d0913327e6b5d3/docs/research/E1_DEPENDENCE_EVIDENCE_STUDY.md"
      commit: "ee61a710243c74ec49d5896167d0913327e6b5d3"
      note: >
        The study's decision record (verdict: Narrow, standing objections,
        corrections to its own first draft) lives beside it in the same
        repository directory.
    last_reviewed: "2026-08-24"
    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: docs/research/E1_DEPENDENCE_EVIDENCE_STUDY.md
        bound_ref: "ee61a710243c74ec49d5896167d0913327e6b5d3"
        note: fires when the frozen study document on the default branch changes
      - type: manual
        enforcement: manual
        event: E2 produces empirical results — the synthetic scoping here must be restated
    falsifier:
      condition: >
        The frozen E1 construction fails to retain the stated equal singleton
        and pairwise values while yielding the stated different three-way
        probabilities (0 under even parity and 0.25 under odd parity), or
        the bound study does not record the stated Narrow decision.
      consequence: REJECT
    forbidden_rescues:
      - do not switch to different marginals, overlaps, or generators after failure and call it the same construction
      - do not turn failure of the concrete construction into a generic possibility claim without a new, stated construction
    non_claims:
      - the parity construction demonstrates possibility, not frequency, in
        real guardrail stacks — no claim of empirical prevalence
      - nothing here validates the framework's practical or deployed value;
        "we validated CC" is prohibited at every rung of the repository's
        evidence ladder
      - the product-baseline failure directions observed in E1 are properties
        of the tested generators, not universal constants

