  - id: MC-004
    proposition: >
      On the per-item guard-verdict files publicly released with Multimodal
      Safeguard Bench's full_run (pinned commit below; six verdict files and
      the release's two printed-metric files hash-verified), the three guards
      — Llama Guard 4, Llama Guard 3 Vision, ShieldGemma 2 — have
      harness-normalized native `unsafe` labels whose static Boolean OR is 1
      on 192 of 200 harmful-labelled text items (8 all-zero rows, 4.0%) and
      all 200 harmful-labelled image items (0 all-zero rows), while the same
      OR is 1 on 32 of 250 benign-labelled text items (12.8%) and every one
      of 250 benign-labelled image items. Llama Guard 3 Vision alone has a
      1-bit on all 250 released benign image items. The complete 2^3
      native-label pattern table, leave-one-out bit ORs, and unique bit
      contributions for each released stratum are bound below. The release
      prints per-guard metrics and two two-guard compositions; it prints no
      three-guard bit OR, no all-zero-row count, no leave-one-out table, and
      no pattern decomposition — and every recomputed quantity that overlaps
      what it does print is asserted equal to the printed value.
    scope: >
      Exactly the six committed verdict files of the full_run directory at
      the bound commit: 400 harmful and 500 benign items, each stratum half
      text and half image, one Boolean `blocked` adapter bit per item per
      guard. Let L be the release's harmful/benign label, A_s each guard's
      native `unsafe` predicate, B_s the harness mapping of that predicate
      to `blocked`, and O = OR_s B_s. The bound arithmetic reports B and O
      conditional on L. Because the harness uses `blocked` items to suppress
      target generation, O is also a valid counterfactual harness-block
      decision for these released rows under a fixed block-on-any rule. It
      does not establish a source-defined translation from every A_s to one
      shared catch event E: Llama Guard 3 Vision is a multimodal
      prompt/response classifier, while ShieldGemma 2 is an image-only
      three-policy classifier, and the pipeline merely maps each native
      `unsafe` label to `blocked`. Counting arithmetic only, at the
      guards' released native operating rules (the Llama guards emit labels
      autoregressively; ShieldGemma 2 blocks above a 0.5 policy-violation
      probability; the source documents no matched operating-point
      calibration, so M-ladder threshold comparability is unchanged).
      ShieldGemma 2's text-item bits are deterministic passes as committed
      and documented upstream, which is why its text column is zero — an
      explicit released outcome, not missing data. Strata are computed
      exactly as released and never folded; file totals are sums of the
      bound strata and carry no additional content. Computed by
      scripts/reanalyze_msbench.py from scripts/mjgd_reference.py; the
      expected block below is what CI re-asserts against the downloaded,
      hash-verified files.
