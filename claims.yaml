  - id: REL-001
    proposition: >
      HYPOTHESIS — Among English-reading professionals who made or materially
      prepared a go/hold recommendation for an AI-based system in paid work
      during the prior 12 months, an E2-derived dependence-aware uncertainty
      presentation will increase HOLD decisions by at least 15 percentage
      points relative to a stipulated-independence presentation of the same
      evidence.
    scope: >
      A preregistered, simulated practitioner decision task. It is untested,
      has no participant data, and cannot activate until the first real
      conforming E2 result clears its frozen evidence, legal, privacy, and
      ethics gates. It is not a claim about actual deployments, customer value,
      safety, or general practitioner behavior.
    dimensions:
      visibility: public
      provenance: owner_attested
      support_role: none
      evidential_status: untested
      maturity: experimental
    support:
      url: null
      commit: null
      note: >
        The protocol is operationalized and held for public binding with its
        research revision. No participant result or public study artifact is
        yet offered as support.
    last_reviewed: "2026-08-24"
    review_window_days: 30
    review_triggers:
      - type: manual
        enforcement: manual
        event: a public protocol revision is bound, a real E2 result activates or prevents activation, or participant recruitment begins
    falsifier:
      condition: >
        After exactly 360 randomized eligible practitioners and a passing
        missingness gate, the upper endpoint of the frozen two-sided 95%
        Newcombe/Wilson interval for the Condition-B minus Condition-A HOLD
        risk difference is below +15 percentage points.
      consequence: REJECT
    forbidden_rescues:
      - do not redefine success as engagement, aesthetics, confidence, perceived sophistication, comprehension, reading time, qualitative enthusiasm, or another secondary outcome
      - do not change the 15-point threshold, E2 study or pair, task threshold, primary outcome, interval method, sample target, stopping rule, or exclusions after outcomes are known
      - do not use a post-hoc subgroup, relaxed eligibility screen, missingness filter, top-up, or rerun to rescue an unfavorable primary result
      - do not generalize a simulated task result to actual deployment, broad practitioner relevance, customer value, adoption, or safety
    non_claims:
      - no practitioner decision, E2-derived participant packet, consent record, recruitment, or study outcome exists yet
      - this does not establish that dependence-aware evidence changes real deployment decisions, is generally useful, or justifies its cost
      - this is not a customer-demand, payment, adoption, safety, or certification claim

  - id: MC-001
    proposition: >
      As of 2026-08-27, among 19 public guardrail evaluations meeting the
      Missing Column Census's frozen inclusion criteria (v1), 13 establish
      comparable per-system results on a shared item set, and 4 publish at
      least one item-level joint statistic for a combination of the
      systems they evaluate or release per-item outcomes that make one
      directly computable.
    scope: >
      A census claim about public reporting, bounded by the documented
      search protocol frozen in census.yaml before examination began. It
      covers the artifacts that search found, not everything in
      existence; it says nothing about how well any evaluated system or
      stack performs, and nothing about what the unmeasured joint
      statistics would show. N, M, and K are recomputed mechanically from
      census.yaml by scripts/verify_census.py; this envelope's expected
      block is cross-checked against that computation in CI. "Comparable"
      is used here in the frozen criteria's sense — shared items and a
      shared event definition — which is weaker than matched operating
      thresholds and full exposure, so M is published as a ladder rather
      than a single number: 13 on the shared basis, 12 once the one row
      that states a threshold mismatch (ML6) is removed, and 0 that
      document matched operating thresholds together with full exposure.
      Nothing here asserts that the 13 are interchangeable at a common
      operating point; the opposite is the finding. The frozen
      phrase "separately attributable" did not specify whether a product
      or model name must be printed: the primary count treats systems a
      source distinguishes and reports consistently as separately
      attributable even when anonymized; the declared named-products-only
      sensitivity excludes Unit42 and mechanically yields N/M/K = 18/12/4.
      A drafted further clause — that
      no printed joint statistic among the four covers a commercial
      guardrail API — was withdrawn before publication when same-day
      adversarial review produced a live counterexample under one
      defensible reading (WAInjectBench's printed ensemble includes GPT-4o
      prompted as a detector); this claim's forbidden rescues bar narrowing
      "commercial" after the fact, so the clause was dropped rather than
      reinterpreted, and the event is recorded in the census revision
      history.
    dimensions:
      visibility: public
      provenance: owner_authored
      support_role: site_document
      evidential_status: supported_within_scope
      maturity: experimental
    support:
      url: "https://github.com/Cubits11/cubits11.github.io/blob/main/census.yaml"
      commit: null
      note: >
        Mutable link by design; the local-content trigger below detects
        edits, and every row in the file binds to its own primary source
        with passages, dates, and a correction history.
    expected:
      n_examined: 19
      m_comparable: 13
      k_present: 4
      # The M ladder. Printing one M lets a reader assume the strongest
      # reading of "comparable"; all three rungs are cross-checked in CI.
      m_strata:
        shared_basis: 13
        threshold_not_contradicted: 12
        threshold_documented_full_exposure: 0
    last_reviewed: "2026-08-28"
    review_window_days: 60
    review_triggers:
      - type: local_content_change
        enforcement: executable
        path: census.yaml
        sha256: "80c530da058b30dc6d7b816c94d21c7beadcecadd5670466e47b3e339c80c8a6"
        note: fires when the census changes without a claim re-review
      - type: manual
        enforcement: manual
        event: >
          a new qualifying evaluation is published or reported, an author
          corrects a row, or a benchmark publishes a previously absent
          joint statistic
    falsifier:
      condition: >
        A qualifying public evaluation meeting criteria v1 and published
        on or before 2026-08-27 is shown to have been missed by the
        documented search, or an examined row is shown to misreport its
        source such that recomputed N, M, or K differ from the stated
        19/13/4.
      consequence: REJECT
    forbidden_rescues:
      - do not reinterpret "joint statistic" after a counterexample appears in order to keep the stated counts
      - do not reclassify an examined row without recording the change and its reason in the census correction history
      - do not treat the bounded-search disclaimer as license to ignore a demonstrated miss — a miss rejects these counts and the corrected census states new ones
      - do not cite readership, links, or reuse of the census as evidence of its accuracy
    non_claims:
      - does not claim any evaluated guardrail stack performs poorly; an unfilled column is a reporting fact, not a performance finding
      - does not claim the unmeasured joint statistics would reveal dependence; measuring instead of assuming is the point
      - does not audit the quality of any per-system evaluation beyond the fields each row records
      - does not cover artifacts outside the documented bounded search or after the stated date

  - id: MC-002
    proposition: >
      On the 170-prompt per-item subset publicly released with BELLS's
      2025 misuse-detection evaluation (pinned commit below), the five
      specialized supervisors — Lakera Guard, Prompt Guard, LangKit,
      NeMo Guardrails, LLM Guard — jointly catch 73 of the 82 prompts
      labelled harmful and jointly miss 9 (11.0%), while the product of
      their individual miss rates is 3.5%: the observed joint miss on
      this subset is about three times what independent misses would
      predict. The same union flags 19 of the 50 benign prompts.
    scope: >
      Exactly the released file at the bound commit: 170 of the
      evaluation's 990 non-adversarial prompts (the study's ~4,165
      adversarial prompts have no per-item release), selected by the
      authors under an unstated rule. Counting arithmetic only, at the
      vendors' released binary verdicts; no population estimate, no
      uncertainty interval, and no claim about any system's true rates
      is offered or licensed. Computed by
      scripts/reanalyze_bells_subset.py from scripts/mjgd_reference.py;
      the expected block below is what CI re-asserts against the
      downloaded, hash-verified file.
    dimensions:
      visibility: public
      provenance: machine_generated_owner_executed
      support_role: executed_output
      evidential_status: supported_within_scope
      maturity: experimental
    support:
      url: "https://github.com/CentreSecuriteIA/bells_leaderboard/blob/507566c5a4606c8e3dec0bd59a5c5fde62594951/data/non_adversarial_prompts.csv"
      commit: "507566c5a4606c8e3dec0bd59a5c5fde62594951"
      note: >
        The upstream repository declares no license, so the file is
        cited and hash-verified (sha256 791dd4b0a168f2eb5831b308083a49
        2e83200a9fa82585643c739023b03f57c3, asserted by the
        reproduction script), never redistributed from this record.
    expected:
      n_prompts: 170
      n_harmful: 82
      per_guard_catches:
        lakera_guard: 52
        prompt_guard: 5
        langkit: 25
        nemo: 70
        llm_guard: 0
      union_detection: 73
      all_miss: 9
      n_benign: 50
      benign_union_flagged: 19
    last_reviewed: "2026-08-27"
    review_window_days: 60
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: CentreSecuriteIA/bells_leaderboard
        path: data/non_adversarial_prompts.csv
        bound_ref: "507566c5a4606c8e3dec0bd59a5c5fde62594951"
        note: fires when the released subset on the default branch changes
      - type: manual
        enforcement: manual
        event: >
          the authors release the full per-item dataset, state the
          subset's selection rule, or correct the released verdicts
    falsifier:
      condition: >
        Recomputing from the bound, hash-verified file yields any count
        different from the expected block, or the file at the pinned
        ref no longer matches the recorded sha256, or the released
        columns are shown not to be the labelled systems' verdicts.
      consequence: REJECT
    forbidden_rescues:
      - do not substitute a different subset, column set, or harm-level filter to preserve the numbers
      - do not fold borderline prompts into either denominator after seeing the results
      - do not recast this subset arithmetic as a population estimate, with or without an interval, if the primary counts are challenged
      - do not cite the three-times-independence ratio without the selection caveat that scopes it
    non_claims:
      - the subset is author-selected with an unstated rule — nothing here estimates any system's true rate, and no confidence interval is offered because the sampled population is undefined
      - not a ranking or endorsement of any vendor; the released verdicts are at unstated default configurations
      - says nothing about adversarial prompts, which dominate the full evaluation and have no per-item release
      - the three-times-independence ratio describes this subset's arithmetic, not a general law of guardrail dependence

  - id: GA-001
    proposition: >
      Ghost-Ark is a verifier and measurement harness for the provenance
      limits of AI-governance receipts — a research artifact of the S2 Lab,
      Penn State — whose stated thesis is that receipt soundness is a
      ternary relation Sound(C, Σ, P): a receipt identifies an execution
      only up to the kernel of its whole parse → canonicalize → digest
      pipeline, so soundness does not persist by default as the pathology
      alphabet grows or the consumer set widens.
    scope: "The repository README and thesis document at the bound commit."
    dimensions:
      visibility: public
      provenance: lab_repository
      support_role: document
      evidential_status: supported_within_scope
      maturity: in_development
    support:
      url: "https://github.com/PSUCyberSecurityLab/ghost-ark/blob/98c90d8296580f08dd8b6e38fdd2abd7039ec651/docs/research/00_THESIS.md"
      commit: "98c90d8296580f08dd8b6e38fdd2abd7039ec651"
      note: >
        Re-worded 2026-08-23 to track the bound thesis precisely: soundness
        as a ternary relation, and the kernel as a property of the whole
        pipeline rather than of the canonicalizer alone.
    last_reviewed: "2026-08-24"
    review_window_days: 120
    review_triggers:
