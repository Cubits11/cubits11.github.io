    scope: >
      The kernel identification module at the bound commit, re-verified by
      CI on every push and weekly in the witness stage of
      scripts/reproduce_cc001.py. No claim about any deployed system.
    dimensions:
      visibility: public
      provenance: machine_generated_owner_executed
      support_role: executed_output
      evidential_status: supported_within_scope
      maturity: released
    support:
      url: "https://github.com/Cubits11/cc-framework/commit/167aa1ee514ee3d797ed9be2c60120d0c1db71f6"
      commit: "167aa1ee514ee3d797ed9be2c60120d0c1db71f6"
      note: >
        Shares CC-001's bound commit so a single clean-clone checkout
        reproduces both claims; the reproduction script enforces that the
        two bindings stay equal.
    expected:
      marginals: [0.10, 0.10]
      interval: [0.0, 0.1]
      tolerance: 1.0e-9
    last_reviewed: "2026-08-24"
    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: src/cc/kernel/sensitivity.py
        bound_ref: "167aa1ee514ee3d797ed9be2c60120d0c1db71f6"
        note: fires when the identification module on the default branch diverges from the bound revision
      - type: manual
        enforcement: manual
        event: witness API change outside the bound module file
    falsifier:
      condition: >
        Bound identify() execution fails any stated interval, witness
        feasibility constraint, marginal constraint, or endpoint-attainment
        assertion at the declared tolerance.
      consequence: REJECT
    forbidden_rescues:
      - do not replace a failed endpoint witness with an interior distribution or a loose approximate candidate
      - do not waive a failed sum, nonnegativity, marginal, or attainment constraint by changing the tolerance after the outcome
    non_claims:
      - endpoint witnesses are feasible mathematical worlds, not observed
        systems
      - attainment does not select a point inside the interval or estimate
        the true dependence

  - id: CC-005
    proposition: >
      CC-Framework's E2 — the shared-item empirical guardrail pilot — is
      governed by a measurement contract frozen before any dataset was
      inspected; no conforming dataset has been collected, so E2 is
      untested, and the contract's conformance checks are executable.
    scope: >
      The frozen contract document at the bound commit. Freezing is a
      discipline about how evidence will be gathered; it is not evidence.
    dimensions:
      visibility: public
      provenance: owner_authored
      support_role: document
      evidential_status: supported_within_scope
      maturity: released
    support:
      url: "https://github.com/Cubits11/cc-framework/blob/0b9450251b6988fa23d8e6e4fb556a08b05e652e/docs/research/E2_MEASUREMENT_CONTRACT.md"
      commit: "0b9450251b6988fa23d8e6e4fb556a08b05e652e"
      note: >
        The claim is about the contract's existence and its frozen,
        untested status — the exact state the contract's own header
        declares.
    last_reviewed: "2026-08-24"
    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: docs/research/E2_MEASUREMENT_CONTRACT.md
        bound_ref: "0b9450251b6988fa23d8e6e4fb556a08b05e652e"
        note: fires when the frozen contract on the default branch changes
      - type: manual
        enforcement: manual
        event: a conforming dataset is collected — E2's status must be restated
    falsifier:
      condition: >
        Evidence shows that an eligible E2 dataset was inspected, selected
        against, or analyzed before the contract was frozen, or that the
        stated executable conformance checks do not exist, or that a
        conforming dataset has been collected while the claim remains marked
        untested.
      consequence: NARROW
    forbidden_rescues:
      - do not relabel pre-freeze exposure as “not inspection” after learning its outcomes
      - do not reissue a changed contract after data inspection and call it preregistered
      - do not cite the synthetic rehearsal as a conforming empirical dataset
    non_claims:
      - freezing a contract establishes discipline, not results; E2 remains
        untested until conforming observations exist
      - conformance is not a clean bill of health, and the contract says so
      - '"we validated CC" is prohibited at every rung of the evidence
        ladder'

  - id: CC-006
    proposition: >
      CC-Framework's E2 measurement pipeline was rehearsed end to end on three
      synthetic guardrail mechanisms: 66 observation rows conform to the frozen
      E2 schema with zero validator violations, the pre-registered negative
      controls behave (the common-cause control attains pA(1-pA) to 1e-9), and
      the finding records the result as a null at n=22 with a quantified cost
      for real E2 (~1097 shared items for epsilon=0.05). E2 itself is not run.
    scope: >
      The dry-run finding document at the bound commit. Synthetic toy
      mechanisms only; not deployed guardrails, not a real population, not E2.
    dimensions:
      visibility: public
      provenance: owner_authored
      support_role: document
      evidential_status: supported_within_scope
      maturity: in_development
    support:
      url: "https://github.com/Cubits11/cc-framework/blob/327f0684f49768531594d593902ed8907fc717af/docs/research/E2_DRYRUN_FINDING.md"
      commit: "327f0684f49768531594d593902ed8907fc717af"
      note: >
        The finding is backed by the committed harness, frozen corpus, and a
