      license: "CC BY-NC-SA 4.0 (c) 2025 Rick Dakan, Joseph Feller, Anthropic PBC"
      commercial_reuse: noncommercial_only
      rights_note: >
        Studied, cited, and analysed under the licence. NonCommercial and
        ShareAlike both bind: the behaviour taxonomy may not be repackaged into any
        paid curriculum, certification, or commercial derivative without permission.
      commit: null
      note: >
        The published summary. Figures transcribed into
        scripts/mixture_bounds.py and re-asserted against this claim's
        expected block on every CI run; a change upstream fires the manual
        trigger below rather than silently altering a bound.
    expected:
      n_conversations: 9830
      behaviours_total: 24
      behaviours_observable: 11
      checks_facts_overall_pct: 8.7
      checks_facts_artifact_diff_pp: -3.7
      checks_facts_reduction_min_pct: 29
      checks_facts_reduction_max_pct: 43
      behaviours_rising: 3
      behaviours_falling: 3
    last_reviewed: "2026-08-28"
    review_window_days: 90
    review_triggers:
      - type: local_content_change
        enforcement: executable
        path: scripts/mixture_bounds.py
        sha256: "1b61adfa34d1c7a48fb8460c9712545cef951ee64a407bd2a936bc0b2592b66d"
        note: fires when the transcribed figures or the bound change
      - type: manual
