  - id: E6-001
    proposition: >
      E6 extracted the client-side model kernel that anthropic.com/institute/econ-scenarios
      ships (Turbopack module 303412, sha256 0a75763f…), gated it against the twelve
      printed numbers of Table 3 of the Anthropic Institute's Working Paper 2026-02, and
      evaluated it only at parameter vectors built from the five marginal quantiles that
      paper prints in Table 2. The kernel reproduces all twelve Table 3 numbers to the
      printed decimal, and GDP is strictly increasing in each of the five parameters over
      their published interquartile ranges. Holding the four parameters the note to
      Table 4 names at that note's values, the same five marginals admit a median 2030
      GDP anywhere in [2.12, 18.07] percent above the no-AI path across the 1,296
      rank-permutation couplings of their published quartiles: 9.88 at the comonotone
      corner, 8.32 under independence, against the 8.6 the paper obtained by running each
      of 3,259 respondents' own five-vector. The marginals fix an interval fifteen points
      wide, not a point, and the measured joint lies strictly inside it.
    scope: >
