# Claim registry — cubits11.github.io · schema v0.4
#
# The source of truth for every technical claim the site renders with an
# evidence marker. /ledger/ is GENERATED from this file by
# scripts/generate_ledger.py; CI regenerates it and fails on drift, verifies
# every field, checks commit↔URL binding consistency, executes the
# executable review triggers, and enforces the freshness window — on every
# push and weekly.
#
# Schema v0.2 separated the dimensions v0.1 conflated:
#   visibility        public | private
#   provenance        machine_generated_owner_executed | owner_authored |
#                     lab_repository | owner_attested | owner_verified
#   support_role      executed_output | document | repository_readme |
#                     site_document | none
#   evidential_status untested | partially_supported |
#                     supported_within_scope | inconclusive | contradicted
#   maturity          experimental | in_development | released | stable
# "Attested" is a PROVENANCE value, never an evidential status. An
# owner-attested claim with no public artifact is publicly untested — the
# registry says so explicitly.
#
# Schema v0.3 added:
#   maturity          + superseded — for archive-grade records of work whose
#                     framing has been replaced; the claim then records the
#                     succession, bound to the superseding document.
#   expected          optional structured block of machine-readable expected
#                     values that reproduction scripts READ instead of
#                     hard-coding — so a proposition's numbers and the
#                     executed assertion cannot silently diverge.
#   Binding rule      support commits must be reachable from a protected ref
#                     of their repository — checked in CI by
#                     verify_claims.py, one filtered clone per bound repo.
#                     (CC-001 was previously bound to a
#                     commit stranded by an upstream history rewrite; it
#                     survived only as a dangling GitHub object. Re-bound
#                     2026-08-23 with file content verified byte-identical.)
#
# review_triggers carry an enforcement tag:
#   executable — CI detects the event and fails the run when it fires
#   manual     — declared honestly as human-checked; CI cannot detect it
#
# Schema v0.4 adds the smallest durable challenge record:
#   falsifier.condition    the condition that defeats the proposition as stated
#   falsifier.consequence  NARROW | REJECT | HOLD, fixed before that condition
#                           is evaluated
#   forbidden_rescues      post-falsification reinterpretations that cannot be
#                           used to keep the proposition standing; [] is an
#                           explicit finding that no meaningful rescue applies

version: "0.4"
last_owner_review: "2026-08-28"

claims:
  - id: CC-001
    proposition: >
      cc.kernel.strict.frechet_bounds computes Fréchet–Hoeffding endpoint
      bounds for composed binary guardrail failure from declared marginals;
      for marginals (0.10, 0.10) it returns [0.0, 0.10] for the AND event
      and [0.10, 0.20] for OR.
    scope: >
      The kernel module at the bound commit. Reproduced from a clean clone
      (venv, pip install, execute, assert) most recently on 2026-08-23, and
      re-reproduced by CI on every push and weekly. No claim about any
      deployed system.
    dimensions:
      visibility: public
      provenance: machine_generated_owner_executed
      support_role: executed_output
      evidential_status: supported_within_scope
      maturity: released
    support:
      url: "https://github.com/Cubits11/cc-framework/commit/167aa1ee514ee3d797ed9be2c60120d0c1db71f6"
      commit: "167aa1ee514ee3d797ed9be2c60120d0c1db71f6"
      note: >
        Output recorded verbatim in /essays/when-marginals-are-not-enough/;
        continuously reproduced by scripts/reproduce_cc001.py in CI.
        Re-bound 2026-08-23 from a commit stranded by an upstream history
        rewrite to a main-reachable commit; kernel file content verified
        byte-identical across both refs before re-binding.
    expected:
      marginals: [0.10, 0.10]
      bounds:
        "and": [0.0, 0.1]
        "or": [0.1, 0.2]
      tolerance: 1.0e-9
    last_reviewed: "2026-08-24"
    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: src/cc/kernel/strict.py
        bound_ref: "167aa1ee514ee3d797ed9be2c60120d0c1db71f6"
        note: fires when the kernel module on the default branch diverges from the bound revision
      - type: manual
        enforcement: manual
        event: kernel semantics change outside the bound module file
    falsifier:
      condition: >
        A clean-clone execution of the bound module on marginals (0.10,
        0.10) returns AND or OR bounds other than the recorded endpoints,
        beyond the stated tolerance.
      consequence: REJECT
    forbidden_rescues:
      - do not substitute a different input, revision, or numerical tolerance after the failure
      - do not treat a passing wrapper or test harness as evidence for the stated outputs if direct execution disagrees
    non_claims:
      - does not certify any stacked system as safe
      - does not recover or estimate the unknown dependence
      - does not select a point inside the returned interval

