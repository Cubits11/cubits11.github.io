      condition: >
        A source-level review of the bound thesis shows that it does not
        state soundness as a ternary relation over the whole parse →
        canonicalize → digest pipeline, or does not identify Ghost-Ark as
        the stated S2 Lab research artifact.
      consequence: NARROW
    forbidden_rescues:
      - do not replace a whole-pipeline claim with a canonicalizer-only claim after the condition fires
      - do not treat verifier acceptance or a pathology-free sample as evidence of semantic safety, authorization, or correctness
    non_claims:
