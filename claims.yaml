# Claim registry — cubits11.github.io · schema v0.2
#
# The source of truth for every technical claim the site renders with an
# evidence marker. /ledger/ is GENERATED from this file by
# scripts/generate_ledger.py; CI regenerates it and fails on drift, verifies
# every field, checks commit↔URL binding consistency, executes the
# executable review triggers, and enforces the freshness window — on every
# push and weekly.
#
# Schema v0.2 separates the dimensions v0.1 conflated:
#   visibility        public | private
#   provenance        machine_generated_owner_executed | owner_authored |
#                     lab_repository | owner_attested | owner_verified
#   support_role      executed_output | document | repository_readme |
#                     site_document | none
#   evidential_status untested | partially_supported |
#                     supported_within_scope | inconclusive | contradicted
#   maturity          experimental | in_development | released | stable
# "Attested" is a PROVENANCE value, never an evidential status. An
# owner-attested claim with no public artifact is publicly untested — the
# registry now says so explicitly.
#
# review_triggers carry an enforcement tag:
#   executable — CI detects the event and fails the run when it fires
#   manual     — declared honestly as human-checked; CI cannot detect it

version: "0.2"
last_owner_review: "2026-08-20"

claims:
  - id: CC-001
    proposition: >
      cc.kernel.strict.frechet_bounds computes Fréchet–Hoeffding endpoint
      bounds for composed binary guardrail failure from declared marginals;
      for marginals (0.10, 0.10) it returns [0.0, 0.10] for the AND event
      and [0.10, 0.20] for OR.
    scope: >
      The kernel module at the bound commit. Reproduced from a clean clone
      (venv, pip install, execute, assert) on 2026-08-20, and re-reproduced
      by CI on every push and weekly. No claim about any deployed system.
    dimensions:
      visibility: public
      provenance: machine_generated_owner_executed
      support_role: executed_output
      evidential_status: supported_within_scope
      maturity: released
    support:
      url: "https://github.com/Cubits11/cc-framework/commit/21f5ff6809a0a16987a39afe56be1e50251ff727"
      commit: "21f5ff6809a0a16987a39afe56be1e50251ff727"
      note: >
        Output recorded verbatim in /essays/when-marginals-are-not-enough/;
        continuously reproduced by scripts/reproduce_cc001.py in CI.
    last_reviewed: "2026-08-20"
    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: src/cc/kernel/strict.py
        bound_ref: "21f5ff6809a0a16987a39afe56be1e50251ff727"
        note: fires when the kernel module on the default branch diverges from the bound revision
      - type: manual
        enforcement: manual
        event: kernel semantics change outside the bound module file
    non_claims:
      - does not certify any stacked system as safe
      - does not recover or estimate the unknown dependence
      - does not select a point inside the returned interval

