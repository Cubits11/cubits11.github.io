  - id: REL-001
    proposition: >
      HYPOTHESIS — Among English-reading professionals who made or materially
      prepared a go/hold recommendation for an AI-based system in paid work
      during the prior 12 months, an E2-derived dependence-aware uncertainty
      presentation will increase HOLD decisions by at least 15 percentage
      points relative to a stipulated-independence presentation of the same
      evidence.
    scope: >
      A preregistered, simulated practitioner decision task. It is untested,
      has no participant data, and cannot activate until the first real
      conforming E2 result clears its frozen evidence, legal, privacy, and
      ethics gates. It is not a claim about actual deployments, customer value,
      safety, or general practitioner behavior.
    dimensions:
      visibility: public
      provenance: owner_attested
      support_role: none
      evidential_status: untested
      maturity: experimental
    support:
      url: null
      commit: null
      note: >
        The protocol is operationalized and held for public binding with its
        research revision. No participant result or public study artifact is
        yet offered as support.
    last_reviewed: "2026-08-24"
    review_window_days: 30
    review_triggers:
      - type: manual
        enforcement: manual
        event: a public protocol revision is bound, a real E2 result activates or prevents activation, or participant recruitment begins
    falsifier:
      condition: >
        After exactly 360 randomized eligible practitioners and a passing
        missingness gate, the upper endpoint of the frozen two-sided 95%
        Newcombe/Wilson interval for the Condition-B minus Condition-A HOLD
        risk difference is below +15 percentage points.
      consequence: REJECT
    forbidden_rescues:
      - do not redefine success as engagement, aesthetics, confidence, perceived sophistication, comprehension, reading time, qualitative enthusiasm, or another secondary outcome
      - do not change the 15-point threshold, E2 study or pair, task threshold, primary outcome, interval method, sample target, stopping rule, or exclusions after outcomes are known
      - do not use a post-hoc subgroup, relaxed eligibility screen, missingness filter, top-up, or rerun to rescue an unfavorable primary result
      - do not generalize a simulated task result to actual deployment, broad practitioner relevance, customer value, adoption, or safety
    non_claims:
      - no practitioner decision, E2-derived participant packet, consent record, recruitment, or study outcome exists yet
      - this does not establish that dependence-aware evidence changes real deployment decisions, is generally useful, or justifies its cost
      - this is not a customer-demand, payment, adoption, safety, or certification claim

  - id: MC-001
    proposition: >
      As of 2026-08-27, among 20 public guardrail evaluations meeting the
      Missing Column Census's frozen inclusion criteria (v1), 14 establish
      a shared item set and a common event definition; 5 provide one of the
      census's declared joint-evidence artifacts: a printed composition
      result or per-item outcomes that make one directly computable.
    scope: >
      A census claim about public reporting, bounded by the documented
      search protocol documented in census.yaml. Its literal inclusion
      wording is locked in repository history before row classification;
      that is a reproducibility lock, not an independent preregistration.
      It
      covers the artifacts that search found, not everything in
      existence; it says nothing about how well any evaluated system or
      stack performs, and nothing about what the unmeasured joint
      statistics would show. N, M, and K are recomputed mechanically from
      census.yaml by scripts/verify_census.py; this envelope's expected
      block is cross-checked against that computation in CI. Since census
      schema v3 the joint-evidence mode counts in this note are derived the
      same way, from a declared joint_scope_additional field, rather than
      counted by hand here; scripts/verify_facts.py binds every current
      census numeral on every public page, and on the deployed page after
      release, to the quantity it asserts. M is a ladder,
      not a comparability verdict: 14 document shared items and a common
      event definition, 12 have no stated threshold mismatch, and 0
      document matched operating thresholds together with full exposure.
      Nothing here asserts that the 14 are interchangeable at a common
      operating point; the opposite is the finding. The 5 is an inclusive
      discovery count of noninterchangeable artifacts, not an all-miss rate
      or a deployment conclusion. Four artifacts print at least one
      composition result and two release aligned per-item outcomes from
      which joint statistics are directly computable; one artifact does
      both, so those descriptions intentionally overlap. The frozen
      phrase "separately attributable" did not specify whether a product
      or model name must be printed: the primary count treats systems a
      source distinguishes and reports consistently as separately
      attributable even when anonymized; the declared named-products-only
      sensitivity excludes Unit42 and mechanically yields N/M/K = 19/13/5.
      A drafted further clause — that
      no printed joint statistic among the then-four covers a commercial
      guardrail API — was withdrawn before publication when same-day
      adversarial review produced a live counterexample under one
      defensible reading (WAInjectBench's printed ensemble includes GPT-4o
      prompted as a detector); this claim's forbidden rescues bar narrowing
      "commercial" after the fact, so the clause was dropped rather than
      reinterpreted, and the event is recorded in the census revision
      history. On 2026-08-30, a post-release source audit found the distinct
      Multimodal Safeguard Bench repository, whose currently public Git
      history carries a pre-cutoff commit timestamp, and which the documented
      search had missed. That met this claim's prior REJECT falsifier: the
      19/13/4 envelope is rejected and retained in census revision history.
      This 20/14/5 envelope is its corrected, superseding proposition, not
      a reinterpretation of the former count.
    dimensions:
      visibility: public
      provenance: owner_authored
      support_role: site_document
      evidential_status: supported_within_scope
      maturity: experimental
    support:
      url: "https://github.com/Cubits11/cubits11.github.io/blob/main/census.yaml"
      commit: null
      note: >
        Mutable link by design; the local-content trigger below detects
        edits, and every row in the file binds to its own primary source
        with passages, dates, and a correction history.
    expected:
      n_examined: 20
      m_shared_basis: 14
      k_present: 5
      # The M ladder. Printing only a shared basis lets a reader assume
      # matched policy; all three rungs are cross-checked in CI.
      m_strata:
        shared_basis: 14
        threshold_not_contradicted: 12
        threshold_documented_full_exposure: 0
    last_reviewed: "2026-09-07"
    review_window_days: 60
    review_triggers:
      - type: local_content_change
        enforcement: executable
        path: census.yaml
        sha256: "0e130c67013fe834df32c7f8de5afac5cb8d2dc4f66b66423bd6a98016e7c598"
        note: >-
          fires when the census changes without a claim re-review;
          re-reviewed 2026-09-01 after declaring the
          pre-freeze-visibility-evidenced sensitivity: the row that moved
          19/13/4 to 20/14/5 is in the 20 on GitHub-recorded dates that do
          not record when its repository became publicly visible; the
          Wayback Machine's CDX index held no capture of it at any date when
          checked on 2026-09-01, and no other archive was queried.
          The sensitivity's 19/13/4 alternative envelope is now asserted by
          verify_census.py rather than living in revision prose. No row,
          classification, evidence field, or primary count changed; N/M/K
          remain 20/14/5 and the M ladder remains 14/12/0.
      - type: manual
        enforcement: manual
        event: >
          a new qualifying evaluation is published or reported, an author
          corrects a row, or a benchmark publishes a previously absent
          joint statistic
    falsifier:
      condition: >
        A qualifying public evaluation meeting criteria v1 and published
        on or before 2026-08-27 is shown to be absent from this corrected
        census, or an examined row is shown to misreport its
        source such that recomputed N, M, or K differ from the stated
        20/14/5.
      consequence: REJECT
    forbidden_rescues:
      - do not reinterpret "joint statistic" after a counterexample appears in order to keep the stated counts
      - do not reclassify an examined row without recording the change and its reason in the census correction history
      - do not treat the bounded-search disclaimer as license to ignore a demonstrated miss — a miss rejects the current counts and the corrected census must state new ones
      - do not cite readership, links, or reuse of the census as evidence of its accuracy
    non_claims:
      - does not claim any evaluated guardrail stack performs poorly; an unfilled column is a reporting fact, not a performance finding
      - does not claim the unmeasured joint statistics would reveal dependence; measuring instead of assuming is the point
      - does not audit the quality of any per-system evaluation beyond the fields each row records
      - does not claim exhaustive coverage beyond the corrected, examined artifact set or coverage after the stated date

  - id: MC-002
    proposition: >
      On the 170-prompt per-item subset publicly released with BELLS's
      2025 misuse-detection evaluation (pinned commit below), the five
      specialized supervisors — Lakera Guard, Prompt Guard, LangKit,
      NeMo Guardrails, LLM Guard — have an OR-union of released binary
      verdict columns that flags 73 of the 82 prompts labelled harmful,
      leaving 9 all-miss (11.0%). The product of their individual miss
      rates is 3.5%; the release-recomputed all-miss rate is about 3.1×
      that independence plug-in on this file. The same OR-union flags 19
      of the 50 benign prompts.
    scope: >
      Exactly the released file at the bound commit: 170 of the
      evaluation's 990 non-adversarial prompts (the study's ~4,165
      adversarial prompts have no per-item release), selected by the
      authors under an unstated rule. Counting arithmetic only, at the
      vendors' released binary verdicts; no population estimate, no
      uncertainty interval, and no claim about any system's true rates
      is offered or licensed. Computed by
      scripts/reanalyze_bells_subset.py from scripts/mjgd_reference.py;
      the expected block below is what CI re-asserts against the
      downloaded, hash-verified file.
    dimensions:
      visibility: public
      provenance: machine_generated_owner_executed
      support_role: executed_output
      evidential_status: supported_within_scope
      maturity: experimental
    support:
      url: "https://github.com/CentreSecuriteIA/bells_leaderboard/blob/507566c5a4606c8e3dec0bd59a5c5fde62594951/data/non_adversarial_prompts.csv"
      license: "none declared upstream"
      commercial_reuse: facts_only
      rights_note: >
        The upstream repository states no licence. Only counts derived from the
