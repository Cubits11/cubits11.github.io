    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: docs/research/E2_DRYRUN_FINDING.md
        bound_ref: "327f0684f49768531594d593902ed8907fc717af"
