  - id: GCE-001
    proposition: >
      GCE — the Guardrail Composability Explorer — is a coursework MVP demo
      (AI-285) for toggling guardrails and observing composed behavior. Its
      front-door composability-coefficient framing is superseded by
      CC-Framework's dependence-aware partial identification, whose metric
      taxonomy classifies the older coefficient family as legacy/deprecated.
      GCE is preserved as intellectual lineage, not current theory.
    scope: >
      The supersession record. It is bound to the superseding taxonomy
      document, not to GCE's repository; GCE itself is linked from /archive/
      as a historical artifact.
    dimensions:
      visibility: public
      provenance: owner_authored
      support_role: document
      evidential_status: supported_within_scope
      maturity: superseded
    support:
      url: "https://github.com/Cubits11/cc-framework/blob/75e90c2f1f84fa89562ed4fe46f137e0be236476/docs/theory/metric_taxonomy.md"
      commit: "75e90c2f1f84fa89562ed4fe46f137e0be236476"
      note: >
        The taxonomy's Deprecated Name Mapping records the coefficient
        family (cc_max, cc_rel, delta_add, delta_mult) as "Deprecated;
        legacy formula preserved until v0.4."
    last_reviewed: "2026-08-24"
    review_window_days: 365
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: docs/theory/metric_taxonomy.md
        bound_ref: "75e90c2f1f84fa89562ed4fe46f137e0be236476"
        note: fires if the taxonomy recording the supersession is rewritten
      - type: manual
        enforcement: manual
        event: GCE repository resumed or reframed
    falsifier:
      condition: >
        The bound superseding taxonomy no longer classifies the coefficient
        family as deprecated legacy, or no longer supports the stated
        dependence-aware supersession.
      consequence: NARROW
    forbidden_rescues:
      - do not treat the existence of legacy code or UI as evidence that its framing remains current theory
      - do not substitute a generic preference for newer methods for a recorded theoretical supersession
    non_claims:
      - supersession is a statement about theoretical framing, not about the
        correctness of GCE's code or its value as coursework
      - no current-research claim is made by or for GCE

