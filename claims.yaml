  - id: AF-001
    proposition: >
      Anthropic's AI Fluency Index reports overall prevalences for the 11
      of its framework's 24 behaviours that are directly observable in
      conversations, and percentage-point differences for conversations
      that produced an artifact, but not the artifact share and not which
      comparison group the differences are against. Those published
      numbers therefore do not identify the subgroup rates — but they do
      bound them. Under every feasible artifact share and under either
      reading of the comparison, fact-checking is between 30% and 43% less
      prevalent in artifact conversations, a far larger effect than the
      stated 3.7 percentage points suggests on a base rate of 8.7%. The
      three behaviours that rise in artifact conversations are Description
      behaviours; the three that fall are Discernment behaviours.
    scope: >
      Arithmetic on the figures published in the Index summary, nothing
      more. A pooled rate is a mixture of its subgroups, so a stated
      overall rate and a stated between-group difference bound each
      subgroup rate and their ratio; scripts/mixture_bounds.py computes
      those bounds in closed form and cross-checks them against a sweep.
      This is a re-expression of published numbers on a relative scale, not
      a re-analysis of the underlying conversations, to which this record
      has no access. It inherits every limitation the report declares: the
      findings are correlational, and the report states that users may
      perform fluency behaviours mentally without expressing them
      conversationally — so a fall in transcript-visible checking cannot be
      separated from checking that moved off-platform, which is where
      checking an artifact ordinarily goes. The measured evaluation gap is
      confounded with a measurement gap and these numbers cannot separate
      them. The framework is CC BY-NC-SA 4.0, copyright 2025 Rick Dakan,
      Joseph Feller, and Anthropic PBC; it is cited and analysed here,
      never redistributed or productised.
