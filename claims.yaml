  - id: E3-001
    proposition: >
      E3 — the first pilot this repository ran itself — scored two ungated
      classifiers on 400 harmful and 800 benign items and produced 2,400
      committed observation rows. Its primary pre-registered prediction
      FAILED: excess joint miss was +0.0018 with a 95% bootstrap CI of
      [-0.00096, +0.00706], which includes zero. Both guards missed almost
      everything on this pool (0.9825 and 0.9625), so the Fréchet interval
      the two marginals allow is [0.9450, 0.9625] — 1.75 percentage points
      wide — and the observed joint miss of 0.9475 lies inside it. The
      prediction that it would lie inside HELD; the difficulty-stratification
      prediction was NOT COMPUTED and remains open.
