  - id: GA-001
    proposition: >
      Ghost-Ark is a verifier and measurement harness for the provenance
      limits of AI-governance receipts — a research artifact of the S2 Lab,
      Penn State — whose stated thesis is that receipt soundness is a
      ternary relation Sound(C, Σ, P): a receipt identifies an execution
      only up to the kernel of its whole parse → canonicalize → digest
      pipeline, so soundness does not persist by default as the pathology
      alphabet grows or the consumer set widens.
    scope: "The repository README and thesis document at the bound commit."
    dimensions:
      visibility: public
      provenance: lab_repository
      support_role: document
      evidential_status: supported_within_scope
      maturity: in_development
    support:
      url: "https://github.com/PSUCyberSecurityLab/ghost-ark/blob/98c90d8296580f08dd8b6e38fdd2abd7039ec651/docs/research/00_THESIS.md"
      commit: "98c90d8296580f08dd8b6e38fdd2abd7039ec651"
      note: >
        Re-worded 2026-08-23 to track the bound thesis precisely: soundness
        as a ternary relation, and the kernel as a property of the whole
        pipeline rather than of the canonicalizer alone.
    last_reviewed: "2026-08-23"
    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: PSUCyberSecurityLab/ghost-ark
        path: docs/research/00_THESIS.md
        bound_ref: "98c90d8296580f08dd8b6e38fdd2abd7039ec651"
        note: fires when the thesis document on the default branch changes
    non_claims:
      - a verifying receipt does not establish that the governed action was
        safe, authorized, or semantically correct
      - kernel collisions in real canonicalizers are demonstrated as
        possible, not as prevalent — the repository's E12 sample found 0 of
        64 real payloads carrying any pathology class
      - not hardened for deployment; not post-quantum secure

