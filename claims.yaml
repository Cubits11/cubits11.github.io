  - id: CC-005
    proposition: >
      CC-Framework's E2 — the shared-item empirical guardrail pilot — is
      governed by a measurement contract frozen before any dataset was
      inspected; no conforming dataset has been collected, so E2 is
      untested, and the contract's conformance checks are executable.
    scope: >
      The frozen contract document at the bound commit. Freezing is a
      discipline about how evidence will be gathered; it is not evidence.
    dimensions:
      visibility: public
      provenance: owner_authored
      support_role: document
      evidential_status: supported_within_scope
      maturity: released
    support:
      url: "https://github.com/Cubits11/cc-framework/blob/0b9450251b6988fa23d8e6e4fb556a08b05e652e/docs/research/E2_MEASUREMENT_CONTRACT.md"
      commit: "0b9450251b6988fa23d8e6e4fb556a08b05e652e"
      note: >
        The claim is about the contract's existence and its frozen,
        untested status — the exact state the contract's own header
        declares.
    last_reviewed: "2026-08-24"
    review_window_days: 120
    review_triggers:
      - type: remote_content_change
        enforcement: executable
        repo: Cubits11/cc-framework
        path: docs/research/E2_MEASUREMENT_CONTRACT.md
        bound_ref: "0b9450251b6988fa23d8e6e4fb556a08b05e652e"
        note: fires when the frozen contract on the default branch changes
      - type: manual
        enforcement: manual
        event: a conforming dataset is collected — E2's status must be restated
    falsifier:
      condition: >
        Evidence shows that an eligible E2 dataset was inspected, selected
        against, or analyzed before the contract was frozen, or that the
        stated executable conformance checks do not exist, or that a
        conforming dataset has been collected while the claim remains marked
        untested.
      consequence: NARROW
    forbidden_rescues:
      - do not relabel pre-freeze exposure as “not inspection” after learning its outcomes
      - do not reissue a changed contract after data inspection and call it preregistered
      - do not cite the synthetic rehearsal as a conforming empirical dataset
    non_claims:
      - freezing a contract establishes discipline, not results; E2 remains
        untested until conforming observations exist
      - conformance is not a clean bill of health, and the contract says so
      - '"we validated CC" is prohibited at every rung of the evidence
        ladder'

