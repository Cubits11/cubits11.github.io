    falsifier:
      condition: >
        The report states an artifact share or comparison group under which
        the relative reduction falls outside [30%, 43%]; or a published
        figure differs from the transcription; or the closed-form bound
        disagrees with a direct sweep over feasible shares.
      consequence: NARROW
    forbidden_rescues:
      - do not widen the stated interval after the fact to accommodate a figure that falls outside it
      - do not restate the bound as an estimate of the artifact-conversation rate
      - do not present the Description-rises / Discernment-falls pattern as causal, or as evidence that artifacts reduce evaluation rather than relocate it
      - do not repackage the framework's behaviour taxonomy into any commercial or certification artifact; the licence is NonCommercial ShareAlike
    non_claims:
      - not a criticism of the Index; the observability boundary and the correlational limits are the report's own declared statements
      - not a claim about any individual's competence, and not a measure of anyone's diligence
      - not evidence that artifact production causes less checking — the published marginals cannot separate a behaviour change from a measurement change
      - no access to the underlying conversations; this is arithmetic on a published summary

  - id: GA-001
    proposition: >
      Ghost-Ark is a verifier and measurement harness for the provenance
      limits of AI-governance receipts — a research artifact of the S2 Lab,
      Penn State — whose stated thesis is that receipt soundness is a
      ternary relation Sound(C, Σ, P): a receipt identifies an execution
      only up to the kernel of its whole parse → canonicalize → digest
      pipeline, so soundness does not persist by default as the pathology
      alphabet grows or the consumer set widens.
