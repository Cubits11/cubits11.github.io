  - id: E7B-001
    proposition: >
      E7B is the first non-degenerate preregistered measurement this repository has
      produced, and all five of its predictions held on data unread when they were fixed.
      Against a preregistration frozen at f646e136 before any hold-out byte was
      retrieved, six of nine published guardrail-judge score sets reached a 5% benign
      false-flag budget on their shared 96-item AgentDojo pool (21 injection goals, 75
      benign) and yielded 15 non-degenerate pairs. Median excess joint miss was +0.2018
      and mean +0.1852 (P1, P2 HELD); the median pair's observed joint miss sat 0.900 of
      the way to the Fréchet upper bound its own marginals allow (P3 HELD); every
      observed joint lay inside its interval (P4 HELD); and every one of the 15 pairs had
      an observed joint miss above the independence product (P5 HELD). On the modal pair
      two judges each miss about half the injection goals, independence predicts a 0.249
      both-miss rate, and the observed rate is 0.476 — exactly the upper bound, meaning
      one judge's misses are a subset of the other's. Seven of the fifteen pairs sit at
      that bound.
    scope: >
      Exactly the 15 rows committed at experiments/e7b/results/observations.jsonl,
      computed 2026-09-10 from nine published score files in
      shawnray-research/certified-agent-guardrails at commit
      79097583be7786976ea1b9ae79f3ff900d9e66b7 (MIT). Labels are the 35 strings of
      _inj_goals.json in that tree. One operating point per judge, set by the
      preregistered rule — the lowest threshold among a judge's benign scores at which
      its benign false-flag rate is at or below 5% — and three judges excluded for not
      reaching it. 21 harmful items, so every rate moves in steps of 0.048; no confidence
      procedure was preregistered and none is reported. The 15 pairs come from 6 judges
      and are not independent; no multiplicity control was preregistered. Supersedes
      nothing: E7 on the seven frontier judges is VOID on a defective preregistration
      that stated its threshold rule in two contradictory directions, those judges are
      spent, and experiments/e7/RESULT.md records that rather than repairing it. No model
      was loaded and no API called, so the host refusal at
      experiments/e2/run/adapters.py:48 is not engaged. Nothing here transfers to E2's
      guards, to any deployed stack, or to any vendor product.
    dimensions:
      visibility: public
      provenance: machine_generated_owner_executed
      support_role: executed_output
      evidential_status: supported_within_scope
      maturity: experimental
    support:
      url: https://github.com/Cubits11/cubits11.github.io/blob/main/experiments/e7b/results/observations.jsonl
      commit: null
      note: >
        The support is the measurement itself: 15 committed pair rows. The commit order is
        load-bearing — PREREG.md's commit f646e136 precedes the results commit, which is
        the evidence that the nine hold-out score files were unread when the five
        predictions were fixed. The upstream score files are pinned by commit and cached
        under freeze/cache/; they are MIT-licensed and their redistribution is permitted,
        unlike E6's kernel bytes.
    expected:
      source_sha: "79097583be7786976ea1b9ae79f3ff900d9e66b7"
      prereg_commit: "f646e136e16db428e72094167bc30040b2c9fcc7"
