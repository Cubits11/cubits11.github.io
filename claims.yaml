  - id: MC-003
    proposition: >
      For k guardrails scored on a common item set at a common operating
      point under block-on-any composition, the rate at which every guard
      misses the same item is fixed by the published per-guard miss rates
      only up to the interval [max(0, Σp − (k−1)), min p], and every point
      of that interval is attained by some joint law with those marginals.
      Marginals prove non-degradation of a static OR composition relative
      to its best member, but, when that identified set is non-degenerate,
      they do not identify strictly positive incremental benefit. They also
      identify a positive lower bound on static benign union-flag rate when
      any member has a positive benign flag rate. On the BELLS 2025 partial
      per-item release — 82 prompts labelled harmful —
      the exact finite identified set is {0/82 … 12/82}; MC-002 recomputes
      9/82 all-miss from the hash-verified released verdict file. Marginal
      catch counts plus the union identify only bounds on each guard's
      exclusive full-stack coverage; the registered leave-one-out unions
      identify the realized values: NeMo 18, Lakera 3, and LangKit, Prompt
      Guard, and LLM Guard 0 on this stratum.
    scope: >
      The mathematics is classical — Bonferroni for the lower endpoint,
      monotonicity for the upper, Fréchet for sharpness — and nothing here
      claims to have derived it. What is contributed is the application:
      pricing, in probability units, what marginal-only guardrail reporting
      leaves undetermined, and identifying leave-one-out unions as a compact
      privacy-preserving disclosure of exclusive full-stack coverage. They
      do not identify pairwise or higher-order overlap, Shapley values, or
      causal structure. Every statement is conditional on block-on-any
      composition, per-item decisions that are functions of the item alone,
      a fixed population, full exposure, and a fixed operating point; it
      says nothing about sequential routes where downstream measurement is
      censored by upstream blocks, agentic systems where an intervention
      changes the trajectory, or any vendor's product. The empirical half is
      one stratum of one author-selected subset: 82 harmful prompts, with 50
      benign and 38 borderline held as separate strata and never folded in.
      It is a BELLS-specific reproduction, not an assertion that BELLS is
      the census's only per-item outcome release.
      scripts/reanalyze_bells_subset.py re-computes the BELLS counts from
      the hash-verified upstream file in CI; scripts/identification.py
      checks the stated identification transformations against that
      registered envelope.
    dimensions:
