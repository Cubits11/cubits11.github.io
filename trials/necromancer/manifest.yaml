# ------------------------------------------------------ epistemic contract
falsifier: >-
  With n ≥ 8 enrolled learners (4 to 5 per arm, assigned by the frozen seed),
  arm A's median correct sorts on the cold transfer case does not exceed arm
  B's median by 2 or more (consequence NARROW at exactly 1, KILL at 0 or
  below); or either arm's cold median is not strictly greater than its own
  pre-task median (consequence KILL); or any reachable state of the
  instrument shows a bare case with its key, a trained-case move without its
  rule and source, an arm table other than the seeded one, or a receipt that
  omits the instrument hash — each checked by scripts/verify_trial.py.

non_claims:
  - nothing here asserts the method works; the three-way post-result sort is the wedge under test, not a result
  - nothing here is novel, a standard, or certifiable; prior art exists in evidence-first AI assurance and in reproducible-research teaching
  - the trained case is constructed; the two filters, the 100 items and the 9 misses are declared inputs, not a measurement of any system
  - the two bare cases are constructed by a fresh-context author from a fixed template; their difficulty match is asserted by structure, not measured
  - a pilot of eight to ten people decides CONTINUE, NARROW or KILL for this lesson and nothing beyond it; it does not estimate an effect size
  - reactions, confidence, time, self-report and the trained-case score are recorded in full and decide nothing
  - the receipt is self-reported by the learner and unverifiable beyond its hash; the pilot assumes good faith and says so
  - TRIAL IV is a name from the owner's registry entry PC-001; no trials I to III exist and none is promised
  - the trained case's key and the template names are in the page source before the trained sort; the debrief shows them anyway. The bare-case keys are not in the source
  - the manifest and the case file are public, so a learner who reads them before answering knows the split and the move order; the invitation asks them not to, and the pilot cannot detect it

adversarial_misreadings:
  A_the_lesson_works: the status strip says HYPOTHESIS and that no human has answered; the falsifier names the kill
  B_this_is_a_course: TRIAL IV is one slice; the non-claims say so; no second trial, certificate or landing page exists
  C_the_repo_certifies_people: no score is stored, no badge issued; the receipt is a record the learner returns, not a credential
  D_the_cases_are_real_data: the trained case is tagged constructed; the bare cases name no real organisation
  E_surrender_is_always_wrong: the correction arm includes REJECT executed as sealed; surrender is retracting beyond the evidence, not retracting
  F_rescue_is_any_rerun: REPLAY AT THE FROZEN CONFIGURATION is a correction; the debrief names the test — nothing frozen moves

performance_budget:
  html_bytes_max: 90000
  js_bytes_max: 30000
  new_font_files: 0
  images_fetched_on_load: 0
  third_party_requests: 0
